<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- مكتبات التليجرام و TON Connect -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0d14;
            --card-bg: rgba(22, 28, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --ton-blue: #0098ea;
            --ton-blue-glow: rgba(0, 152, 234, 0.3);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body { 
            background: var(--bg-primary); 
            margin: 0; 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            color: var(--text-main); 
            -webkit-tap-highlight-color: transparent;
        }

        .wallet-container { 
            padding: 16px; 
            max-width: 440px; 
            margin: 0 auto; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }

        /* كارت الرصيد الرئيسي بلمسة زجاجية Glow */
        .balance-card { 
            background: linear-gradient(135deg, rgba(24, 32, 47, 0.9) 0%, rgba(15, 20, 31, 0.95) 100%);
            padding: 24px 20px; 
            border-radius: 20px; 
            border: 1px solid var(--card-border); 
            margin-bottom: 20px; 
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1); 
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--ton-blue-glow) 0%, transparent 60%);
            opacity: 0.15;
            pointer-events: none;
        }

        .zn-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .usd-balance { 
            color: var(--text-main); 
            font-size: 38px; 
            font-weight: 800; 
            letter-spacing: -1px;
            margin: 4px 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .ton-estimate { 
            color: var(--ton-blue); 
            font-size: 14px; 
            font-weight: 700;
            background: rgba(0, 152, 234, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 6px;
        }

        /* أزرار التبويبات الفخمة */
        .tabs { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 20px; 
            background: rgba(15, 20, 31, 0.8); 
            padding: 5px; 
            border-radius: 14px; 
            border: 1px solid var(--card-border);
        }

        .tab-btn { 
            flex: 1; 
            padding: 12px 8px; 
            border: none; 
            color: var(--text-sub); 
            border-radius: 10px; 
            background: transparent; 
            font-weight: 700; 
            font-size: 14px; 
            transition: all 0.25s ease; 
            cursor: pointer; 
        }

        .tab-btn.active { 
            background: var(--ton-blue); 
            color: #ffffff; 
            box-shadow: 0 4px 15px var(--ton-blue-glow); 
        }

        /* كروت الأقسام الداخلية */
        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 18px; 
            border: 1px solid var(--card-border); 
            margin-bottom: 16px; 
            backdrop-filter: blur(10px);
        }

        .input-group { margin-bottom: 16px; }
        .input-label { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; display: block; text-align: right; font-weight: 600; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(10, 13, 20, 0.6); 
            color: #fff; 
            box-sizing: border-box; 
            outline: none; 
            font-size: 16px; 
            font-weight: 600;
            transition: border-color 0.2s; 
        }

        .input-field:focus { border-color: var(--ton-blue); }

        .quick-chips {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .chip-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chip-btn:active { background: rgba(255, 255, 255, 0.15); }

        .action-btn { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s; 
        }

        .action-btn:active { transform: scale(0.98); }
        .btn-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; box-shadow: 0 4px 15px var(--accent-green-glow); }
        .btn-blue { background: linear-gradient(135deg, #0098ea 0%, #0077b6 100%); color: white; box-shadow: 0 4px 15px var(--ton-blue-glow); }

        .ton-price-ticker { 
            font-size: 12px; 
            color: var(--text-sub); 
            text-align: center; 
            margin-top: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .locked-state { 
            padding: 24px; 
            text-align: center; 
            background: rgba(239, 68, 68, 0.05); 
            border: 1px solid rgba(239, 68, 68, 0.2); 
            border-radius: 16px; 
        }

        .connected-state { 
            padding: 12px 14px; 
            margin-bottom: 16px; 
            background: rgba(16, 185, 129, 0.08); 
            border: 1px solid rgba(16, 185, 129, 0.2); 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .wallet-address-text { color: var(--accent-green); font-size: 12px; font-weight: 600; word-break: break-all; text-align: right; flex: 1; }
        .disconnect-btn { background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; margin-right: 10px; }

        /* 🎨 تخصيص مودال TON Connect ومنع الألوان الافتراضية البرتقالية */
        #tc-widget-root, [data-tc-modal="true"] {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
        }
        
        /* إجبار لون الأزرار والعناصر الخاصة بالربط على نظام ألوان التطبيق */
        div[class*="tc-modal-container"] {
            background-color: #0a0d14 !important;
        }
    </style>
</head>
<body>

<div id="main-wallet-section" class="wallet-container">
    
    <!-- كارت الرصيد الكلي -->
    <div class="balance-card">
        <div class="zn-pill">
            <span>⚡ رصيد ZN:</span>
            <b id="wallet-zn-balance" style="color:#fff;">0</b>
        </div>
        <div id="wallet-usd-balance" class="usd-balance">$0.00000</div>
        <div id="wallet-ton-estimate" class="ton-estimate">≈ 0.0000 TON</div>
    </div>

    <!-- أزرار التبويبات -->
    <div class="tabs">
        <button id="btn-withdraw" onclick="renderWalletTab('withdraw')" class="tab-btn">سحب</button>
        <button id="btn-history" onclick="renderWalletTab('history')" class="tab-btn">السجلات</button>
        <button id="btn-deposit" onclick="renderWalletTab('deposit')" class="tab-btn">إيداع</button>
    </div>

    <!-- حاوية محتوى التبويب -->
    <div id="wallet-content">
        <div class="card" style="text-align:center; padding:30px; color:var(--text-sub);">
            جاري تهيئة المحفظة...
        </div>
    </div>

    <!-- مؤشر سعر الـ TON اللحظي -->
    <div class="ton-price-ticker">
        <span class="live-dot"></span>
        سعر 1 TON اللحظي = $<span id="current-ton-price">...</span>
    </div>
</div>

<div id="hidden-ton-root" style="display: none;"></div>

<script src="../game.js"></script>
<script src="wallet.js?v=6"></script>
</body>
</html>
