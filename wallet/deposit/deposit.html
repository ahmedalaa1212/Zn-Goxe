<div class="deposit-container" style="direction: rtl; font-family: system-ui, -apple-system, sans-serif; color: #fff; max-width: 500px; margin: 0 auto; padding: 10px;">
    
    <!-- كارت رأس القائمة ورمز شبكة TON -->
    <div style="background: linear-gradient(145deg, rgba(0, 152, 234, 0.18), rgba(15, 23, 42, 0.95)); border: 1px solid rgba(0, 152, 234, 0.35); border-radius: 18px; padding: 18px; margin-bottom: 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3);">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px;">
            <div style="width: 36px; height: 36px; background: #0098EA; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px rgba(0, 152, 234, 0.6);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <span style="font-weight: 800; font-size: 17px; color: #38bdf8;">شحن رصيد USDT عبر شبكة TON</span>
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin: 0 0 12px 0; line-height: 1.5;">اختر باقة الشحن ليتم ربط المحفظة تلقائياً ودفع المعاملة بضغطة واحدة</p>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, 0.08);">
                <span style="font-size: 12px; color: #cbd5e1;">سعر TON الحقيقي الآن:</span>
                <span id="ton-live-price" style="font-size: 13px; font-weight: 800; color: #34d399; font-family: monospace;">~$1.30</span>
            </div>
            <!-- حاوية زر الاتصال المباشر بالمحفظة -->
            <div id="ton-connect-btn-container" style="margin-top: 6px; min-height: 40px; display: flex; justify-content: center; align-items: center;"></div>
        </div>
    </div>

    <!-- شبكة باقات الشحن المجلوبة من الفايربيس -->
    <div style="margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
        <span style="font-size: 14px; font-weight: 800; color: #f8fafc;">💵 باقات الشحن المتاحة:</span>
        <span style="font-size: 11px; color: #38bdf8; font-weight: 600;">إيداع فوري تلقائي</span>
    </div>

    <div id="deposit-packages-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; min-height: 180px;">
        <!-- يتم جلب وبناء باقات الفايربيس تلقائياً هنا -->
    </div>

    <!-- نافذة متابعة حالة التحويل والتحقق -->
    <div id="deposit-pay-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 99999; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #0f172a; border: 1px solid rgba(0, 152, 234, 0.4); border-radius: 20px; padding: 24px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="font-size: 40px; margin-bottom: 10px;">📲</div>
            <h3 style="margin: 0 0 10px 0; color: #38bdf8; font-size: 18px;">جاري إكمال الدفع بالمحفظة</h3>
            <p id="deposit-modal-status" style="font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px;">
                يرجى مواصلة وتأكيد عملية التحويل داخل نافذة المحفظة.
            </p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="window.depositModule?.retrySelectedPackage()" style="background: #0098EA; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px;">
                    💎 إعادة المحاولة
                </button>
                <button onclick="window.depositModule?.closeModal()" style="background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; cursor: pointer; font-size: 13px;">
                    إلغاء
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        var container = document.getElementById('ton-connect-btn-container');
        if (container) { container.innerHTML = ''; }
        
        if (window.depositModule && typeof window.depositModule.init === 'function') {
            window.depositModule.init();
        }
    })();
</script>
<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" onload="var c=document.getElementById('ton-connect-btn-container'); if(c) c.innerHTML=''; if(window.depositModule){window.depositModule.init();}else if(typeof window.init_deposit_module==='function'){window.init_deposit_module();}" style="display:none;" />
