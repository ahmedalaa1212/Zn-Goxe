<div class="withdraw-container" style="direction: rtl; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; max-width: 500px; margin: 0 auto; box-sizing: border-box;">
    
    <!-- كارت ربط محفظة TON الذكي -->
    <div style="background: linear-gradient(135deg, rgba(15,23,42,0.85), rgba(0,136,204,0.15)); border: 1px solid rgba(0,136,204,0.35); border-radius: 14px; padding: 14px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="font-size: 13px; font-weight: bold; color: #38bdf8;">عنوان محفظة TON (Tonkeeper / Telegram Wallet):</label>
            <button type="button" onclick="window.withdrawModule?.connectWallet()" style="background: rgba(0, 136, 204, 0.25); border: 1px solid #0088cc; color: #38bdf8; font-size: 11px; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s ease;">
                🔗 ربط تلقائي
            </button>
        </div>
        <input type="text" id="withdraw-address-input" placeholder="أدخل العنوان المباشر EQ... أو UQ..." style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; font-size: 13px; font-family: monospace; box-sizing: border-box; outline: none; text-align: left; direction: ltr;" />
    </div>

    <!-- إدخال كمية العملات -->
    <div style="background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 14px; margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="font-size: 13px; font-weight: bold; color: #e2e8f0;">كمية عملات ZN المراد سحبها:</label>
            <button type="button" onclick="window.withdrawModule?.setMaxAmount()" style="background: transparent; border: none; color: #38bdf8; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: underline;">
                [ الحد الأقصى المتاح ]
            </button>
        </div>
        <input type="number" id="withdraw-amount-input" placeholder="0" min="0" step="any" oninput="window.withdrawModule?.calculateLiveExchange()" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #38bdf8; font-size: 18px; font-weight: bold; font-family: monospace; box-sizing: border-box; outline: none;" />
        <div style="font-size: 11px; color: #94a3b8; margin-top: 6px; display: flex; justify-content: space-between;">
            <span>💡 معدل التحويل: 100,000 ZN = $1.00 USD</span>
        </div>
    </div>

    <!-- كارت تفاصيل الحساب اللحظي (الصافي والسعر المباشر) -->
    <div style="background: rgba(0, 0, 0, 0.3); border: 1px dashed rgba(0, 136, 204, 0.3); border-radius: 14px; padding: 14px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: #94a3b8;">
            <span>خصم رسوم التحويل (3%):</span>
            <span id="withdraw-fee-display" style="color: #f87171; font-weight: bold; font-family: monospace;">0 ZN</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #e2e8f0;">
            <span>الصافي المتبقي بالدولار:</span>
            <span id="withdraw-usd-display" style="color: #34d399; font-weight: bold; font-family: monospace;">$0.00</span>
        </div>
        <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <span style="font-size: 13px; color: #38bdf8; font-weight: bold; display: block;">الصافي المقدر بعملة TON:</span>
                <span id="withdraw-ton-rate-info" style="font-size: 10px; color: #64748b;">(سعر TON الحقيقي: جاري التحديث...)</span>
            </div>
            <span id="withdraw-ton-display" style="font-size: 17px; color: #38bdf8; font-weight: 800; font-family: monospace;">0.0000 TON</span>
        </div>
    </div>

    <!-- زر التأكيد -->
    <button id="withdraw-submit-btn" onclick="window.withdrawModule?.submitWithdrawal()" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #0088cc, #0284c7); color: #ffffff; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,136,204,0.4); transition: all 0.2s ease;">
        تأكيد طلب السحب الفوري 🚀
    </button>
    
    <div id="withdraw-status-msg" style="margin-top: 12px; text-align: center; font-size: 13px; font-weight: bold; display: none; padding: 10px; border-radius: 8px;"></div>
</div>
