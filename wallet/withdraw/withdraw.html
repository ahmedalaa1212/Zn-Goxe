<div class="withdraw-container">
    <!-- قسم ربط المحفظة -->
    <div id="wallet-connect-section" class="card">
        <h3>ربط المحفظة</h3>
        <button id="ton-connect-btn" class="btn-primary">ربط المحفظة (Tonkeeper / Telegram)</button>
        <p id="connected-address" class="address-text hidden"></p>
    </div>

    <!-- نموذج السحب -->
    <div id="withdraw-form" class="card disabled-form">
        <div class="input-group">
            <label>عدد العملات المراد سحبها:</label>
            <input type="number" id="coins-input" placeholder="أدخل عدد العملات" />
        </div>

        <div class="input-group">
            <label>القيمة المقابلة بـ TON (غير قابل للتعديل):</label>
            <input type="text" id="ton-output" readonly placeholder="0.00 TON" />
        </div>

        <!-- تفاصيل الرسوم -->
        <div class="fee-details">
            <p>خصم رسوم التحويل (3%): <span id="fee-amount">0 COINS</span></p>
            <p>الصافي النهائي للمحفظة: <span id="net-ton">0.00 TON</span></p>
        </div>

        <!-- التنبيهات -->
        <div class="notice-box warning">
            ⚠️ <strong>تنبيه منع الغش:</strong> استخدام الحسابات المتعددة أو برامج التلاعب يؤدي لبند دائم وحظر الأرباح.
        </div>
        <div class="notice-box info">
            ℹ️ استلام السحب يستغرق من <strong>دقيقة واحدة إلى 48 ساعة</strong> حسب مستوى السحب.
        </div>

        <button id="confirm-withdraw-btn" class="btn-success" disabled>تأكيد السحب</button>
    </div>
</div>
