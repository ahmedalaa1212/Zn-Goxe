<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>متجر الترقيات | ZN Goxe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        /* شريط الأرصدة علوي */
        .header-balances {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .balance-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-card .title {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .balance-card .amount {
            font-size: 18px;
            font-weight: bold;
        }

        .amount.zn { color: var(--accent-gold); }
        .amount.usd { color: var(--accent-green); }

        /* التبويبات */
        .shop-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* كروت الترقيات */
        .upgrades-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upgrade-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .upgrade-title {
            font-size: 15px;
            font-weight: bold;
        }

        .upgrade-desc {
            font-size: 12px;
            color: var(--text-sub);
        }

        .upgrade-price {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .price-zn { color: var(--accent-gold); }
        .price-usd { 
            color: var(--accent-green); 
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .buy-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .buy-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .badge-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-sub);
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <!-- الأرصدة الحالية للمستخدم -->
    <div class="header-balances">
        <div class="balance-card">
            <div class="title">رصيد العملات (ZN)</div>
            <div class="amount zn" id="user-zn-balance">0.00</div>
        </div>
        <div class="balance-card">
            <div class="title">رصيد الدولار (USD)</div>
            <div class="amount usd" id="user-usd-balance">$0.0000</div>
        </div>
    </div>

    <!-- تبويبات المتجر -->
    <div class="shop-tabs">
        <button class="tab-btn active" onclick="switchTab('speed')">⚡ سرعة التعدين</button>
        <button class="tab-btn" onclick="switchTab('storage')">📦 سعة المخزن</button>
    </div>

    <!-- قائمة الترقيات -->
    <div id="speed-tab" class="upgrades-list"></div>
    <div id="storage-tab" class="upgrades-list" style="display: none;"></div>

    <script>
        let userData = {};
        let gameSettings = {};

        // جلب بيانات المستخدم وإعدادات اللعبة عند التحميل
        async function loadShopData() {
            try {
                const res = await fetch('/api/get_user_data');
                const data = await res.json();
                
                userData = data.user;
                gameSettings = data.settings;

                updateUI();
            } catch (err) {
                console.error("خطأ في تحميل بيانات المتجر:", err);
            }
        }

        function updateUI() {
            // تحديث عرض الأرصدة
            document.getElementById('user-zn-balance').innerText = (userData.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('user-usd-balance').innerText = '$' + (userData.usd_balance || 0).toFixed(4);

            renderSpeedUpgrades();
            renderStorageUpgrades();
        }

        // عرض ترقيات السرعة
        function renderSpeedUpgrades() {
            const container = document.getElementById('speed-tab');
            container.innerHTML = '';

            const upgrades = gameSettings.upgrade_config || {};
            const userUpgrades = userData.upgrades || {};

            Object.keys(upgrades).forEach(lvl => {
                const cfg = upgrades[lvl];
                const count = userUpgrades[`lvl${lvl}`] || 0;
                const costZn = parseFloat(cfg.cost_zn || 0);
                const costUsd = parseFloat(cfg.cost_usd || 0);
                const rateBonus = parseFloat(cfg.rate_bonus || 0);

                // التحقق من توفر الرصيدين معا
                const canAffordZn = userData.balance >= costZn;
                const canAffordUsd = costUsd === 0 || userData.usd_balance >= costUsd;
                const isMax = count >= 15;

                // شرط شراء المستوى السابق أولاً
                let prevUnlocked = true;
                if (parseInt(lvl) > 1) {
                    const prevCount = userUpgrades[`lvl${parseInt(lvl) - 1}`] || 0;
                    if (prevCount === 0) prevUnlocked = false;
                }

                let priceHTML = `<span class="price-zn">${costZn.toLocaleString()} ZN</span>`;
                if (costUsd > 0) {
                    priceHTML += ` <span class="price-usd">+ $${costUsd.toFixed(2)} USD</span>`;
                }

                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-title">
                            المستوى ${lvl} 
                            <span class="badge-count">(${count}/15)</span>
                        </div>
                        <div class="upgrade-desc">+${rateBonus} ZN/ساعة</div>
                        <div class="upgrade-price">${priceHTML}</div>
                    </div>
                    <button class="buy-btn" 
                        ${(!canAffordZn || !canAffordUsd || isMax || !prevUnlocked) ? 'disabled' : ''} 
                        onclick="buySpeedUpgrade(${lvl})">
                        ${isMax ? 'مكتمل' : (!prevUnlocked ? 'مغلق' : 'شراء')}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // عرض ترقيات المخزن
        function renderStorageUpgrades() {
            const container = document.getElementById('storage-tab');
            container.innerHTML = '';

            const capacities = gameSettings.storage_capacities || {};
            const currentLvl = parseInt(userData.storage_level || 0);
            const nextLvl = currentLvl + 1;

            if (nextLvl > 9 || !capacities[nextLvl.toString()]) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-sub);">المخزن في أعلى مستوى حالياً (MAX)</div>';
                return;
            }

            const cfg = capacities[nextLvl.toString()];
            const costZn = parseFloat(cfg.cost_zn || 0);
            const costUsd = parseFloat(cfg.cost_usd || 0);
            const capacity = parseFloat(cfg.capacity || 0);

            const canAffordZn = userData.balance >= costZn;
            const canAffordUsd = costUsd === 0 || userData.usd_balance >= costUsd;

            let priceHTML = `<span class="price-zn">${costZn.toLocaleString()} ZN</span>`;
            if (costUsd > 0) {
                priceHTML += ` <span class="price-usd">+ $${costUsd.toFixed(2)} USD</span>`;
            }

            const card = document.createElement('div');
            card.className = 'upgrade-card';
            card.innerHTML = `
                <div class="upgrade-info">
                    <div class="upgrade-title">ترقية إلى المستوى ${nextLvl}</div>
                    <div class="upgrade-desc">السعة الجديدة: ${capacity.toLocaleString()} ZN</div>
                    <div class="upgrade-price">${priceHTML}</div>
                </div>
                <button class="buy-btn" 
                    ${(!canAffordZn || !canAffordUsd) ? 'disabled' : ''} 
                    onclick="buyStorageUpgrade()">
                    ترقية
                </button>
            `;
            container.appendChild(card);
        }

        // تنفيذ شراء ترقية السرعة
        async function buySpeedUpgrade(level) {
            try {
                const res = await fetch('/api/buy_upgrade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: level })
                });
                const result = await res.json();

                if (result.success) {
                    userData.balance = result.new_balance;
                    userData.usd_balance = result.new_usd_balance;
                    userData.hourly_rate = result.new_hourly_rate;
                    userData.upgrades = result.upgrades;
                    updateUI();
                    alert("تمت الترقية بنجاح! 🚀");
                } else {
                    alert(result.error || "تعذر تنفيذ العملية");
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال بالخادم");
            }
        }

        // تنفيذ شراء ترقية المخزن
        async function buyStorageUpgrade() {
            try {
                const res = await fetch('/api/buy_storage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await res.json();

                if (result.success) {
                    userData.balance = result.new_balance;
                    userData.usd_balance = result.new_usd_balance;
                    userData.storage_level = result.storage_level;
                    userData.max_cap = result.max_cap;
                    updateUI();
                    alert("تمت ترقية المخزن بنجاح! 📦");
                } else {
                    alert(result.error || "تعذر تنفيذ العملية");
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال بالخادم");
            }
        }

        // التنقل بين التبويبات
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('speed-tab').style.display = tab === 'speed' ? 'flex' : 'none';
            document.getElementById('storage-tab').style.display = tab === 'storage' ? 'flex' : 'none';
            
            event.target.classList.add('active');
        }

        // بدء تحميل البيانات
        loadShopData();
    </script>
</body>
</html>
