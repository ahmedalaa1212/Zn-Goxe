<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المتجر - Zn Goxe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../style.css?v=13.2">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1c1c1c;
            --primary: #f39c12;
            --primary-glow: rgba(243, 156, 18, 0.3);
            --telegram-blue: #0088cc;
            --gold: #ffcc00;
            --accent-red: #ff4444;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* هيدر الرصيد الثابت العلوي */
        .balance-header-fixed {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--primary);
            padding: 8px 25px;
            border-radius: 30px;
            z-index: 100;
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .shop-container {
            padding: 15px;
            padding-top: 70px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* بطاقة معدل الإنتاج والرصيد */
        .shop-stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* باقات USDT */
        .usdt-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }

        .usdt-card {
            min-width: 130px;
            flex: 1;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="balance-header-fixed">
        <span>🪙</span>
        <span id="top-balance-shop" class="user-balance zn-balance-display">ZN: 0</span>
    </div>

    <div class="shop-container">
        
        <div class="shop-stats-bar">
            <div id="shop-rate" style="color: var(--gold); font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 5px;">
                <span>⚡</span> <span id="shop-rate-text">0/h</span>
            </div>
            <div id="shop-balance" style="color: var(--primary); font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 5px;">
                <span>🪙</span> <span id="shop-balance-text">ZN: 0</span>
            </div>
        </div>

        <h3 style="color: #fff; margin-bottom: 12px; font-size: 18px; display: flex; align-items: center; gap: 8px;">
            <span>💎</span> عروض مميزة (USDT)
        </h3>
        <div class="usdt-container">
            <div class="usdt-card" style="background: linear-gradient(135deg, #1c1c1c, #2a2a2a); border: 1px solid var(--primary); box-shadow: 0 4px 10px rgba(243, 156, 18, 0.2);">
                <div style="font-size: 28px; margin-bottom: 5px;">📦</div>
                <div style="color: #fff; font-weight: bold; font-size: 14px;">باقة المبتدئين</div>
                <div style="color: var(--primary); font-weight: bold; font-size: 16px; margin: 6px 0;">5 USDT</div>
                <button onclick="buyWithUSDT('5')" style="width: 100%; background: var(--primary); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer;">شراء الآن</button>
            </div>
            <div class="usdt-card" style="background: linear-gradient(135deg, #1c1c1c, #332b00); border: 1px solid var(--gold); box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);">
                <div style="font-size: 28px; margin-bottom: 5px;">🚀</div>
                <div style="color: #fff; font-weight: bold; font-size: 14px;">باقة المحترفين</div>
                <div style="color: var(--gold); font-weight: bold; font-size: 16px; margin: 6px 0;">15 USDT</div>
                <button onclick="buyWithUSDT('15')" style="width: 100%; background: var(--gold); color: #000; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer;">شراء الآن</button>
            </div>
            <div class="usdt-card" style="background: linear-gradient(135deg, #1c1c1c, #3a1c1c); border: 1px solid var(--accent-red); box-shadow: 0 4px 10px rgba(255, 68, 68, 0.2);">
                <div style="font-size: 28px; margin-bottom: 5px;">👑</div>
                <div style="color: #fff; font-weight: bold; font-size: 14px;">باقة الحيتان</div>
                <div style="color: var(--accent-red); font-weight: bold; font-size: 16px; margin: 6px 0;">50 USDT</div>
                <button onclick="buyWithUSDT('50')" style="width: 100%; background: var(--accent-red); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer;">شراء الآن</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tab-mining" onclick="switchShopTab('mining')" style="flex: 1; padding: 12px; background: var(--telegram-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">⚡ ترقيات السرعة</button>
            <button id="tab-storage" onclick="switchShopTab('storage')" style="flex: 1; padding: 12px; background: #333; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">📦 ترقيات المخزن</button>
        </div>

        <div id="shop-mining-section" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;"></div>
        <div id="shop-storage-section" style="display: none; grid-template-columns: repeat(2, 1fr); gap: 12px;"></div>

    </div>

    <nav class="bottom-nav">
        <a href="../settings/settings.html"><i>⚙️</i><span>الإعدادات</span></a>
        <a href="shop.html" class="active"><i>🏪</i><span>المتجر</span></a>
        <a href="../games/games.html"><i>🎮</i><span>الألعاب</span></a>
        <a href="../index.html" class="nav-center-btn">
            <i>⚒️</i>
            <span>المزرعة</span>
        </a>
        <a href="../tasks/tasks.html"><i>📋</i><span>المهام</span></a>
        <a href="../wallet/wallet.html"><i>💳</i><span>المحفظة</span></a>
        <a href="../friends/friends.html"><i>👥</i><span>الأصدقاء</span></a>
    </nav>

    <script src="shop.js?v=13.0"></script>
</body>
</html>
