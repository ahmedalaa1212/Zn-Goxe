<style>
    :root {
        --bg-color: #0f0f0f;
        --card-bg: #1c1c1c;
        --primary: #f39c12;
        --telegram-blue: #0088cc;
        --ton-blue: #0098ea;
        --gold: #ffcc00;
        --accent-green: #10b981;
        --accent-red: #ff4444;
        --text-main: #ffffff;
        --text-muted: #aaaaaa;
    }

    .shop-container { 
        padding: 4px 0 15px 0; 
        width: 100%; 
        max-width: 100%; 
        margin: 0 auto; 
        box-sizing: border-box;
    }

    /* تثبيت هيكل شريط الإحصائيات لمنع انكسار العناصر عند التنقل */
    .shop-stats-bar {
        display: grid; 
        grid-template-columns: repeat(3, minmax(0, 1fr)); 
        gap: 6px;
        padding: 8px 4px; 
        background: #161616; 
        border-radius: 14px;
        margin-bottom: 15px; 
        border: 1px solid #2a2a2a;
        width: 100%;
        box-sizing: border-box;
    }

    .stat-box {
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        background: rgba(255, 255, 255, 0.03); 
        padding: 8px 2px;
        border-radius: 10px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
        min-width: 0;
        overflow: hidden;
        box-sizing: border-box;
    }

    .stat-label { 
        font-size: 11px; 
        color: var(--text-muted); 
        margin-bottom: 4px; 
        white-space: nowrap;
        text-align: center;
    }
    
    .stat-value { 
        font-weight: 800; 
        font-size: 12px; 
        white-space: nowrap;
        direction: ltr !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .int-part { font-size: 1em; font-weight: 800; }
    .dec-part { font-size: 0.78em; opacity: 0.75; font-weight: 600; }

    .ton-price-bar {
        background: rgba(0, 152, 234, 0.12); 
        border: 1px solid var(--ton-blue);
        border-radius: 12px; 
        padding: 10px 14px; 
        margin-bottom: 15px;
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        box-sizing: border-box;
    }

    .usdt-container {
        display: flex; 
        gap: 10px; 
        overflow-x: auto; 
        padding-bottom: 10px;
        margin-bottom: 20px; 
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .usdt-container::-webkit-scrollbar { display: none; }

    .usdt-card {
        min-width: 145px; 
        flex: 0 0 145px; 
        border-radius: 12px; 
        padding: 12px;
        text-align: center; 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between;
        box-sizing: border-box;
    }

    .usdt-perks {
        font-size: 11px; 
        color: #ccc; 
        margin: 6px 0; 
        line-height: 1.4;
        text-align: right; 
        background: rgba(0,0,0,0.3); 
        padding: 6px; 
        border-radius: 6px;
    }

    .btn-ton-pay {
        width: 100%; 
        border: none; 
        padding: 8px 6px;
        border-radius: 8px; 
        font-weight: bold; 
        cursor: pointer; 
        margin-top: 5px;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 4px;
        font-size: 12px;
        transition: opacity 0.2s;
    }
    .btn-ton-pay:active { opacity: 0.8; }

    /* تثبيت الارتفاع الأدنى للشبكة لمنع قفز الصفحة أثناء التبديل */
    .shop-section-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        min-height: 280px;
        align-content: start;
    }
</style>

<div class="shop-container">
    <div class="shop-stats-bar">
        <div class="stat-box">
            <span class="stat-label">🪙 ZN</span>
            <span data-bind="balance" id="shop-balance-text" class="stat-value" style="color: var(--primary);">0</span>
        </div>
        <div class="stat-box" style="border-color: rgba(255, 204, 0, 0.2); background: rgba(255, 204, 0, 0.05);">
            <span class="stat-label" style="color: var(--gold);">⚡ السرعة</span>
            <span data-bind="hourly_rate" id="shop-rate-text" class="stat-value" style="color: var(--gold);">+0/h</span>
        </div>
        <div class="stat-box">
            <span class="stat-label" style="color: var(--accent-green);">💵 USD</span>
            <span data-bind="usd_balance" id="shop-usd-text" class="stat-value" style="color: var(--accent-green);">$0.00</span>
        </div>
    </div>

    <div class="ton-price-bar">
        <div style="font-size: 13px; font-weight: bold; color: var(--ton-blue);">
            💎 سعر TON المباشر:
        </div>
        <div id="ton-live-rate-text" data-bind="ton_price" style="font-weight: 800; color: #fff; font-size: 14px; direction: ltr;">جاري التحميل...</div>
    </div>

    <div id="ton-connect-btn" style="display:none;"></div>

    <h3 style="color: #fff; margin-bottom: 12px; font-size: 16px; font-weight: bold;">💎 باقات العروض المميزة (الدفع التلقائي)</h3>
    
    <div class="usdt-container" id="usdt-packages-container">
        <div style="color: #888; font-size: 13px; text-align: center; width: 100%; padding: 20px;">جاري تحميل الباقات المتاحة...</div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button id="tab-mining" onclick="switchShopTab('mining')" style="flex: 1; padding: 11px; background: var(--telegram-blue); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s;">⚡ ترقيات السرعة</button>
        <button id="tab-storage" onclick="switchShopTab('storage')" style="flex: 1; padding: 11px; background: #333333; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s;">📦 ترقيات المخزن</button>
    </div>

    <div id="shop-mining-section" class="shop-section-grid"></div>

    <div id="shop-storage-section" class="shop-section-grid" style="display: none;"></div>
</div>
