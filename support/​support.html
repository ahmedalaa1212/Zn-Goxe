
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدعم الفني</title>
    <style>
        body { background:#0f0f0f; margin:0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; color: #fff; }
        .header { background: #1c1c1c; padding: 15px; text-align: center; border-bottom: 1px solid #333; position: relative; }
        .back-btn { position: absolute; right: 15px; top: 15px; background: none; border: none; color: #00cc66; font-size: 16px; cursor: pointer; }
        .ticket-info { font-size: 12px; color: #aaa; margin-top: 5px; }
        
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-user { background: #00cc66; color: #000; align-self: flex-start; border-bottom-right-radius: 2px; }
        .msg-admin { background: #222; color: #fff; align-self: flex-end; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .msg-system { background: transparent; color: #aaa; align-self: center; font-size: 12px; text-align: center; width: 100%; margin: 10px 0; }
        
        .input-area { background: #1c1c1c; padding: 10px 15px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        .input-area input { flex: 1; background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 20px; outline: none; }
        .input-area button { background: #00cc66; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #000; font-size: 18px; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
        
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #0f0f0f; display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; }
        .spinner { border: 4px solid #333; border-top: 4px solid #00cc66; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top:15px; color:#aaa;">جاري الاتصال بالدعم الفني...</p>
    </div>

    <div class="header">
        <button class="back-btn" onclick="window.history.back()">❮ رجوع</button>
        <h2 style="margin:0; color:#00cc66; font-size:18px;">تواصل معنا</h2>
        <div class="ticket-info" id="ticket-id-display">رقم التذكرة: جاري التحميل...</div>
    </div>

    <div class="chat-container" id="chat-box">
        <!-- Messages will be injected here -->
    </div>

    <div class="input-area" id="input-section">
        <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script src="support.js"></script>
</body>
</html>
