<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة الإدارة العليا | Super Admin Console</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --input-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            direction: rtl;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            font-size: 20px;
            color: var(--accent-gold);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }

        .stat-card .title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-main);
        }

        .stat-card.gold .value { color: var(--accent-gold); }
        .stat-card.green .value { color: var(--accent-green); }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .margin-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .input-group input {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }

        .input-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 12px 0;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
        }

        .perm-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-main);
        }

        .perm-item input {
            accent-color: var(--accent-gold);
            width: 16px;
            height: 16px;
        }

        .moderators-list, .admin-logs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .mod-item, .log-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .mod-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .mod-info span {
            font-size: 10px;
            color: var(--text-muted);
        }

        .btn-danger-sm {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .empty-msg {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 12px;
        }

        .log-admin {
            font-weight: bold;
            color: var(--accent-gold);
        }

        .log-time {
            font-size: 10px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 لوحة الإدارة العليا</h1>
        <p>نظام التحكم المركزي بالأرباح والصلاحيات</p>
    </div>

    <!-- كروت الإحصائيات الحية -->
    <div class="grid-stats">
        <div class="stat-card gold">
            <div class="title">أرباح البوت</div>
            <div class="value" id="statBotProfit">0</div>
        </div>
        <div class="stat-card green">
            <div class="title">أرباح اللاعبين</div>
            <div class="value" id="statUserProfit">0</div>
        </div>
        <div class="stat-card">
            <div class="title">الربح الفعلي</div>
            <div class="value" id="statActualMargin">0%</div>
        </div>
    </div>

    <!-- قسم التحكم بالمنظومة ونسب الأرباح -->
    <div class="section-card">
        <div class="section-title">⚙️ التحكم المباشر بأرباح الألعاب</div>
        
        <div class="margin-controls">
            <div class="input-group">
                <label>نسبة أرباح البوت (%)</label>
                <input type="number" id="targetMarginInput" min="0" max="100" placeholder="70" disabled>
            </div>
            <div class="input-group">
                <label>نسبة اللاعبين (%)</label>
                <input type="number" id="playerMarginInput" placeholder="30" disabled>
            </div>
        </div>

        <button class="btn-primary" id="btnEditMargin" onclick="enableMarginEdit()">✏️ تعديل نسبة التحكم</button>
        <button class="btn-primary" id="btnPublishMargin" onclick="updateGameSettings()" style="display: none; background: var(--accent-green); color: #fff;">🚀 حفظ ونشر النسب فوراً</button>
    </div>

    <!-- قسم إدارة المشرفين والصلاحيات -->
    <div class="section-card">
        <div class="section-title">👤 إضافة مشرف جديد</div>
        
        <div class="margin-controls" style="margin-bottom: 8px;">
            <div class="input-group">
                <label>معرّف التليجرام (ID)</label>
                <input type="text" id="modTelegramId" placeholder="12345678">
            </div>
            <div class="input-group">
                <label>اسم المشرف</label>
                <input type="text" id="modName" placeholder="أحمد">
            </div>
        </div>

        <div class="permissions-grid">
            <label class="perm-item"><input type="checkbox" id="perm_users" checked> إدارة المستخدمين</label>
            <label class="perm-item"><input type="checkbox" id="perm_support" checked> الدعم الفني</label>
            <label class="perm-item"><input type="checkbox" id="perm_settings"> الإعدادات العامة</label>
            <label class="perm-item"><input type="checkbox" id="perm_transactions"> المعاملات والمالية</label>
            <label class="perm-item"><input type="checkbox" id="perm_security"> الحظر والأمان</label>
            <label class="perm-item"><input type="checkbox" id="perm_ads"> المهام والإعلانات</label>
        </div>

        <button class="btn-primary" onclick="addNewModerator()">➕ إضافة المشرف وسحب الصلاحيات</button>
    </div>

    <!-- قائمة المشرفين الحاليين -->
    <div class="section-card">
        <div class="section-title">🛡️ المشرفين الحاليين</div>
        <div class="moderators-list" id="moderatorsList">
            <p class="empty-msg">⏳ جاري التحميل...</p>
        </div>
    </div>

    <!-- سجل التحركات الإدارية -->
    <div class="section-card">
        <div class="section-title">📜 سجل النشاطات الإدارية</div>
        <div class="admin-logs" id="adminLogs">
            <p class="empty-msg">⏳ جاري تحميل السجل...</p>
        </div>
    </div>

    <script src="super_admin.js"></script>
</body>
</html>
