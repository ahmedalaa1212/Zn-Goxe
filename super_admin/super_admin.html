<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة الإدارة العليا | Super Admin Console</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --input-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        body {
            padding: 12px;
            padding-bottom: 30px;
            direction: rtl;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            font-size: 18px;
            color: var(--accent-gold);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .header p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70px;
        }

        .stat-card .title {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .stat-card .value {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            word-break: break-word;
        }

        .stat-card.gold .value { color: var(--accent-gold); }
        .stat-card.green .value { color: var(--accent-green); }
        .stat-card.blue .value { color: var(--accent-blue); }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn-refresh:active {
            opacity: 0.7;
            transform: scale(0.95);
        }

        .margin-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .input-group input {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px;
            color: var(--text-main);
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-gold);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 10px 0 14px 0;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .perm-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-main);
            cursor: pointer;
        }

        .perm-item input {
            accent-color: var(--accent-gold);
            width: 15px;
            height: 15px;
        }

        .moderators-list, .admin-logs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .mod-item, .log-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .mod-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .mod-info span {
            font-size: 10px;
            color: var(--text-muted);
        }

        .btn-danger-sm {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .empty-msg {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 10px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>👑 لوحة الإدارة العليا</h1>
            <p>نظام التحكم المركزي بالأرباح والصلاحيات</p>
        </div>

        <!-- كروت الإحصائيات الحية -->
        <div class="grid-stats">
            <div class="stat-card gold">
                <div class="title">أرباح البوت</div>
                <div class="value" id="bot-profit-val">0</div>
            </div>
            <div class="stat-card green">
                <div class="title">أرباح اللاعبين</div>
                <div class="value" id="user-profit-val">0</div>
            </div>
            <div class="stat-card blue">
                <div class="title">الربح الفعلي</div>
                <div class="value" id="actual-profit-pct">0%</div>
            </div>
        </div>

        <!-- 🎮 الكارت الأول: لعبة شبكة ZN Go -->
        <div class="section-card">
            <div class="section-header">
                <div class="section-title">🎮 لعبة شبكة ZN Go</div>
                <button class="btn-refresh" onclick="loadZnGoSettings()">🔄 تحديث</button>
            </div>
            
            <div class="margin-controls">
                <div class="input-group">
                    <label>أرباح البوت (%)</label>
                    <input type="number" id="grid36-bot-margin" min="0" max="100" placeholder="70">
                </div>
                <div class="input-group">
                    <label>أرباح اللاعبين (%)</label>
                    <input type="number" id="grid36-user-margin" placeholder="30" readonly style="opacity:0.7;">
                </div>
                <div class="input-group">
                    <label>الحد الأدنى للرهان</label>
                    <input type="number" id="grid36-min-bet" min="0" placeholder="10">
                </div>
            </div>

            <button class="btn-primary" id="btnSaveGrid36" onclick="saveZnGoSettings()" style="background: var(--accent-green); color: #fff;">💾 حفظ إعدادات شبكة ZN Go</button>
        </div>

        <!-- 🏟️ الكارت الثاني: لعبة الساحة الكبرى -->
        <div class="section-card" style="border: 1px solid var(--accent-gold);">
            <div class="section-header">
                <div class="section-title" style="color: var(--accent-gold);">🏟️ لعبة الساحة الكبرى</div>
                <button class="btn-refresh" onclick="loadBigArenaSettings()">🔄 تحديث</button>
            </div>
            
            <div class="margin-controls">
                <div class="input-group">
                    <label>أرباح البوت (%)</label>
                    <input type="number" id="big-arena-bot-margin" min="0" max="100" placeholder="70">
                </div>
                <div class="input-group">
                    <label>أرباح اللاعبين (%)</label>
                    <input type="number" id="big-arena-user-margin" placeholder="30" readonly style="opacity:0.7;">
                </div>
                <div class="input-group">
                    <label>الحد الأدنى للرهان</label>
                    <input type="number" id="big-arena-min-bet" min="0" placeholder="10">
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 12px; background: var(--input-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--card-border);">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-main); font-size: 11px;">
                    <input type="checkbox" id="big-arena-enabled" style="accent-color: var(--accent-gold); width: 16px; height: 16px;" checked>
                    <span>تفعيل وتشغيل لعبة الساحة الكبرى</span>
                </label>
            </div>

            <button class="btn-primary" id="btnSaveBigArena" onclick="saveBigArenaSettings()" style="background: var(--accent-green); color: #fff;">💾 حفظ إعدادات الساحة الكبرى</button>
        </div>

        <!-- قسم إدارة المشرفين والصلاحيات -->
        <div class="section-card">
            <div class="section-title">👤 إضافة مشرف جديد</div>
            
            <div class="margin-controls" style="grid-template-columns: 1fr 1fr; margin-bottom: 8px;">
                <div class="input-group">
                    <label>معرّف التليجرام (ID)</label>
                    <input type="text" id="modTelegramId" placeholder="12345678">
                </div>
                <div class="input-group">
                    <label>اسم المشرف</label>
                    <input type="text" id="modName" placeholder="أحمد">
                </div>
            </div>

            <div class="permissions-grid">
                <label class="perm-item"><input type="checkbox" id="perm_users" checked> إدارة المستخدمين</label>
                <label class="perm-item"><input type="checkbox" id="perm_support" checked> الدعم الفني</label>
                <label class="perm-item"><input type="checkbox" id="perm_settings"> الإعدادات العامة</label>
                <label class="perm-item"><input type="checkbox" id="perm_transactions"> المعاملات والمالية</label>
                <label class="perm-item"><input type="checkbox" id="perm_security"> الحظر والأمان</label>
                <label class="perm-item"><input type="checkbox" id="perm_ads"> المهام والإعلانات</label>
            </div>

            <button class="btn-primary" onclick="addNewModerator()">➕ إضافة المشرف</button>
        </div>

        <!-- قائمة المشرفين الحاليين -->
        <div class="section-card">
            <div class="section-title">🛡️ المشرفين الحاليين</div>
            <div class="moderators-list" id="moderatorsList">
                <p class="empty-msg">⏳ جاري التحميل...</p>
            </div>
        </div>

        <!-- سجل التحركات الإدارية -->
        <div class="section-card">
            <div class="section-title">📜 سجل النشاطات الإدارية</div>
            <div class="admin-logs" id="adminLogs">
                <p class="empty-msg">⏳ جاري تحميل السجل...</p>
            </div>
        </div>
    </div>

    <script src="super_admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            // حساب نسبة اللاعب التلقائية لشبكة ZN Go
            const gBot = document.getElementById('grid36-bot-margin');
            const gUser = document.getElementById('grid36-user-margin');
            if (gBot && gUser) {
                gBot.addEventListener('input', () => {
                    const val = parseFloat(gBot.value) || 0;
                    gUser.value = Math.max(0, 100 - val).toFixed(2);
                });
            }

            // حساب نسبة اللاعب التلقائية للساحة الكبرى
            const aBot = document.getElementById('big-arena-bot-margin');
            const aUser = document.getElementById('big-arena-user-margin');
            if (aBot && aUser) {
                aBot.addEventListener('input', () => {
                    const val = parseFloat(aBot.value) || 0;
                    aUser.value = Math.max(0, 100 - val).toFixed(2);
                });
            }
        });
    </script>
</body>
</html>
