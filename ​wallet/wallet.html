<div class="wallet-main-wrapper" style="padding: 15px; color: #ffffff; direction: rtl; max-width: 500px; margin: 0 auto;">
    
    <!-- عرض الأرصدة (ZN & USDT) -->
    <div class="wallet-balance-card" style="background: linear-gradient(135deg, rgba(0,136,204,0.15), rgba(0,0,0,0.4)); border: 1px solid rgba(0,136,204,0.3); border-radius: 16px; padding: 18px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; text-align: center;">
            <!-- رصيد ZN -->
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px;">
                <span style="font-size: 13px; color: #aaa; display: block; margin-bottom: 5px;">رصيد العملة (ZN)</span>
                <span style="font-size: 20px; font-weight: bold; color: #0088cc;" data-bind="balance">0.00</span>
                <span style="font-size: 12px; color: #0088cc; font-weight: bold;"> ZN</span>
            </div>
            
            <!-- رصيد USDT -->
            <div style="flex: 1; padding-right: 10px;">
                <span style="font-size: 13px; color: #aaa; display: block; margin-bottom: 5px;">رصيد الدولار (USDT)</span>
                <span style="font-size: 20px; font-weight: bold; color: #26a17b;">$</span>
                <span style="font-size: 20px; font-weight: bold; color: #26a17b;" data-bind="usd_balance">0.00</span>
            </div>
        </div>
    </div>

    <!-- الأزرار الثلاثة (يمين: إيداع | وسط: سجلات | يسار: سحب) -->
    <div class="wallet-nav-actions" style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="btn-tab-deposit" onclick="window.switchWalletTab('deposit')" style="flex: 1; padding: 12px 8px; background: #0088cc; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
            <i class="fas fa-arrow-down-left"></i>
            <span>الإيداع</span>
        </button>

        <button id="btn-tab-history" onclick="window.switchWalletTab('history')" style="flex: 1; padding: 12px 8px; background: rgba(255,255,255,0.08); color: #ccc; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
            <i class="fas fa-receipt"></i>
            <span>السجلات</span>
        </button>

        <button id="btn-tab-withdraw" onclick="window.switchWalletTab('withdraw')" style="flex: 1; padding: 12px 8px; background: rgba(255,255,255,0.08); color: #ccc; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
            <i class="fas fa-arrow-up-right"></i>
            <span>السحب</span>
        </button>
    </div>

    <!-- الحاوية الديناميكية للقوائم الفرعية -->
    <div id="wallet-sub-content" class="wallet-sub-view-container">
        <!-- يتم تحميل المحتوى هنا تلقائياً -->
    </div>

</div>
