<!-- wallet/wallet.html -->
<style>
    .wallet-wrapper {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 10px 5px;
        color: #f8fafc;
        box-sizing: border-box;
    }

    .balance-card {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .balance-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .balance-title {
        font-size: 12px;
        color: #94a3b8;
        font-weight: 600;
    }

    .balance-value {
        font-size: 20px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .val-coin { color: #f59e0b; }
    .val-usd { color: #10b981; }

    .divider {
        width: 1px;
        height: 40px;
        background-color: #334155;
    }

    .action-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .btn-tab {
        background-color: #1e293b;
        border: 1px solid #334155;
        color: #f8fafc;
        padding: 12px 8px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        transition: all 0.2s ease;
    }

    .btn-tab:active {
        transform: scale(0.96);
    }

    .btn-tab.active {
        background-color: #2563eb;
        border-color: #60a5fa;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .content-section {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 16px;
        display: none;
        flex-direction: column;
        gap: 12px;
    }

    .content-section.active {
        display: flex;
    }

    .section-title {
        font-size: 15px;
        font-weight: 700;
        border-bottom: 1px solid #334155;
        padding-bottom: 8px;
    }

    .empty-msg {
        text-align: center;
        color: #94a3b8;
        font-size: 13px;
        padding: 20px 0;
    }
</style>

<div class="wallet-wrapper">
    <!-- 💳 كارت الرصيد -->
    <div class="balance-card">
        <div class="balance-item">
            <span class="balance-title">رصيد النقاط (ZN)</span>
            <div class="balance-value val-coin">
                <span id="coin-balance">0.00</span>
                <span style="font-size: 14px;">🪙</span>
            </div>
        </div>

        <div class="divider"></div>

        <div class="balance-item">
            <span class="balance-title">رصيد الدولار ($)</span>
            <div class="balance-value val-usd">
                <span id="usd-balance">$0.00</span>
                <span style="font-size: 14px;">💵</span>
            </div>
        </div>
    </div>

    <!-- 🔘 خيارات المحفظة -->
    <div class="action-buttons">
        <button class="btn-tab active" data-tab="deposit" onclick="window.switchWalletTab('deposit')">
            <span>📥</span>
            <span>الإيداع</span>
        </button>
        <button class="btn-tab" data-tab="withdraw" onclick="window.switchWalletTab('withdraw')">
            <span>📤</span>
            <span>السحب</span>
        </button>
        <button class="btn-tab" data-tab="history" onclick="window.switchWalletTab('history')">
            <span>📜</span>
            <span>السجلات</span>
        </button>
    </div>

    <!-- 📄 الأقسام التفاعلية -->
    <div id="deposit-section" class="content-section active">
        <div class="section-title">📥 شحن الرصيد</div>
        <p style="font-size: 13px; color: #94a3b8;">اختر طريقة الإيداع المناسبة لك:</p>
        <div id="deposit-options" class="empty-msg">جاري تحميل وسائل الإيداع المتاحة...</div>
    </div>

    <div id="withdraw-section" class="content-section">
        <div class="section-title">📤 طلب سحب</div>
        <p style="font-size: 13px; color: #94a3b8;">قم بتقديم طلب سحب أرباحك إلى محفظتك الخارجيّة.</p>
        <div id="withdraw-form" class="empty-msg">جاري تحميل خيارات السحب...</div>
    </div>

    <div id="history-section" class="content-section">
        <div class="section-title">📜 سجل العمليات</div>
        <div id="history-list" class="empty-msg">لا توجد عمليات سابقة حتى الآن.</div>
    </div>
</div>
