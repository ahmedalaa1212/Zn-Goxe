<div class="wallet-container">
    <!-- كارت المحفظة الرئيسي -->
    <div class="wallet-card">
        <div class="wallet-icon">👛</div>
        <h2 class="wallet-title">محفظة TON</h2>
        <p class="wallet-subtitle">اربط محفظتك لاستلام السحوبات والمكافآت</p>
        
        <div id="wallet-status-box" class="wallet-status disconnected">
            <span id="wallet-address-text">لم يتم ربط المحفظة</span>
        </div>

        <button id="connect-wallet-btn" class="wallet-action-btn primary-btn">
            🔗 ربط محفظة TON
        </button>
        <button id="disconnect-wallet-btn" class="wallet-action-btn danger-btn" style="display: none;">
            ❌ فك الربط
        </button>
    </div>

    <!-- قسم الأرصدة والعمليات -->
    <div class="wallet-actions-grid">
        <div class="action-card">
            <span class="action-title">رصيد ZN</span>
            <span class="action-val" id="wallet-zn-balance">0.00 ZN</span>
        </div>
        <div class="action-card">
            <span class="action-title">رصيد USD</span>
            <span class="action-val" id="wallet-usd-balance">$0.00</span>
        </div>
    </div>

    <!-- زر السحب -->
    <div class="withdraw-section">
        <button id="withdraw-btn" class="wallet-action-btn success-btn">
            💸 طلب سحب الأرباح
        </button>
    </div>
</div>
