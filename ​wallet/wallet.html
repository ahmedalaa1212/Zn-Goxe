<!-- wallet/wallet.html -->
<div id="wallet-container" class="wallet-wrapper">
    <div class="wallet-header-card">
        <h3>💼 المحفظة الرئيسية</h3>
        <div class="balance-display">
            <span id="wallet-main-balance">0</span> <small>GOXE</small>
        </div>
        <div class="usd-balance" id="wallet-usd-balance">$0.00</div>
    </div>

    <!-- أزرار التنقل الرئيسية بين الإيداع والسحب والسجلات -->
    <div class="wallet-actions">
        <button id="btn-wallet-deposit" class="btn-action deposit">➕ إيداع</button>
        <button id="btn-wallet-withdraw" class="btn-action withdraw">➖ سحب</button>
        <button id="btn-wallet-history" class="btn-action history">📜 السجلات</button>
    </div>

    <!-- الحاويات الخاصة بالموديولات الفرعية -->
    <div id="wallet-tab-deposit" class="wallet-tab-content" style="display: none;"></div>
    <div id="wallet-tab-withdraw" class="wallet-tab-content" style="display: none;"></div>
    <div id="wallet-tab-history" class="wallet-tab-content" style="display: none;"></div>
</div>
