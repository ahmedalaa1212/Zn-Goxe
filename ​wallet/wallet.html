<div class="wallet-container" style="padding: 15px; color: #fff;">
    <!-- كارت ملخص الأرصدة -->
    <div class="wallet-header-card" style="background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #334155; margin-bottom: 20px;">
        <h3 style="margin: 0 0 10px 0; color: #94a3b8; font-size: 14px;">محفظتي الرقمية</h3>
        <div class="wallet-balances" style="display: flex; justify-content: space-around; align-items: center; margin-top: 15px;">
            <div>
                <span style="display: block; font-size: 12px; color: #94a3b8;">رصيد ZN</span>
                <strong class="user-balance-val" style="font-size: 18px; color: #f59e0b;">0.00 ZN</strong>
            </div>
            <div style="width: 1px; height: 30px; background: #334155;"></div>
            <div>
                <span style="display: block; font-size: 12px; color: #94a3b8;">رصيد الدولار</span>
                <strong class="usd-balance-val" style="font-size: 18px; color: #10b981;">$0.00</strong>
            </div>
        </div>
    </div>

    <!-- شريط أزرار التنقل بين القوائم الثلاث -->
    <div class="wallet-nav-tabs" style="display: flex; gap: 8px; background: #0f172a; padding: 5px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 20px;">
        <button id="tab-btn-deposit" onclick="switchWalletTab('deposit')" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: #1e293b; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s;">
            📥 إيداع
        </button>
        <button id="tab-btn-withdraw" onclick="switchWalletTab('withdraw')" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #94a3b8; font-weight: bold; cursor: pointer; transition: 0.3s;">
            📤 سحب
        </button>
        <button id="tab-btn-history" onclick="switchWalletTab('history')" style="flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #94a3b8; font-weight: bold; cursor: pointer; transition: 0.3s;">
            📜 السجلات
        </button>
    </div>

    <!-- حاوية العرض الديناميكي للقوائم الثلاث -->
    <div id="sub-wallet-content" class="sub-wallet-content">
        <!-- سيتم تحميل deposit.html أو withdraw.html أو history.html هنا تلقائياً -->
    </div>
</div>
