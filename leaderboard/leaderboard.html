<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل العملات والمتصدرين - ZNX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 15px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .price-box { text-align: center; background: linear-gradient(135deg, #0284c7, #0d9488); border-radius: 10px; padding: 12px; }
        .price-value { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
        .progress-bar-bg { background: #334155; border-radius: 8px; height: 12px; overflow: hidden; margin-top: 8px; }
        .progress-fill { background: #f59e0b; height: 100%; width: 0%; transition: width 0.5s ease; }
        .convert-form input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; margin-top: 5px; }
        .btn-submit { width: 100%; background: #22c55e; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .podium { display: flex; justify-content: space-around; align-items: flex-end; margin-top: 15px; }
        .podium-card { background: #334155; border-radius: 8px; text-align: center; padding: 10px; width: 30%; }
        .rank-1 { border: 2px solid #f59e0b; }
        .rank-2 { border: 2px solid #94a3b8; }
        .rank-3 { border: 2px solid #b45309; }
        .list-item { display: flex; justify-content: space-between; padding: 10px; background: #1e293b; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- سعر العملة اللحظي -->
    <div class="card price-box">
        <div>سعر عملة ZNX اللحظي</div>
        <div class="price-value" id="livePrice">$0.0500</div>
        <small id="tickerStatus">تحديث مباشر كل ثانية</small>
    </div>

    <!-- تقدم المجمّع الكلي -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
            <span>المجمّع الكلي المحول:</span>
            <span id="poolText">0 / 35,000,000 ZNX</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="poolProgress"></div>
        </div>
    </div>

    <!-- نظام تحويل العملات -->
    <div class="card convert-form">
        <h3><i class="fa-solid fa-right-left"></i> تحويل النقاط إلى ZNX</h3>
        <label>أدخل عدد النقاط:</label>
        <input type="number" id="pointsInput" placeholder="مثال: 1000000" oninput="calculatePreview()">
        <div style="margin-top: 8px; font-size: 0.85rem; color: #cbd5e1;">
            المستحق التقديري: <strong id="znxPreview" style="color: #38bdf8;">0 ZNX</strong>
        </div>
        <button class="btn-submit" onclick="submitConversion()">تأكيد التحويل الآن</button>
    </div>

    <!-- منصة المتصدرين -->
    <h3><i class="fa-solid fa-trophy" style="color: #f59e0b;"></i> كبار المالكين (ZNX)</h3>
    <div class="podium" id="podiumArea"></div>
    <div id="leaderboardList" style="margin-top: 15px;"></div>

    <script src="leaderboard.js"></script>
</body>
</html>
