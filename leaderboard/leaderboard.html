<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحويل العملات والمتصدرين - ZNX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151c2c;
            --border-color: #232e47;
            --accent-green: #10b981;
            --accent-blue: #0284c7;
            --accent-gold: #f59e0b;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            -webkit-user-select: none;
        }

        .top-balance-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .balance-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }

        .balance-title {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .balance-amount {
            font-size: 0.95rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .global-stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .progress-bg {
            background: #0f172a;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .price-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        .price-badge {
            font-size: 0.75rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            padding: 3px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .price-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .convert-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .quick-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .custom-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .preview-box {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin: 8px 0;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tiers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tier-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }

        .tier-item.current {
            border: 1px solid var(--accent-gold);
            background: rgba(245, 158, 11, 0.08);
        }

        .tier-badge-active {
            background: var(--accent-gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            margin: 15px 0;
        }

        .podium-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            flex: 1;
        }

        .podium-1 { border-color: var(--accent-gold); height: 95px; }
        .podium-2 { border-color: #94a3b8; height: 80px; }
        .podium-3 { border-color: #b45309; height: 75px; }

        .leader-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- الشريط الأعلى (الرصيد الثلاثي) -->
    <div class="top-balance-bar">
        <div class="balance-box">
            <div class="balance-title"><i class="fa-solid fa-coins" style="color:#f59e0b;"></i> ZN</div>
            <div class="balance-amount" id="znBalance" style="color:#f59e0b;">0</div>
        </div>
        <div class="balance-box">
            <div class="balance-title"><i class="fa-solid fa-wallet" style="color:#10b981;"></i> USD</div>
            <div class="balance-amount" id="usdBalance" style="color:#10b981;">$0.00</div>
        </div>
        <div class="balance-box">
            <div class="balance-title"><i class="fa-solid fa-bolt" style="color:#38bdf8;"></i> ZNX</div>
            <div class="balance-amount" id="znxBalance" style="color:#38bdf8;">0</div>
        </div>
    </div>

    <!-- مجمّع الإجمالي العام لجميع اللاعبين -->
    <div class="global-stats-card">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted);">
            <span><i class="fa-solid fa-globe"></i> إجمالي العملات المستخرجة كلياً</span>
            <span id="globalRatioText" style="color:#38bdf8; font-weight:bold;">0 / 35M ZNX</span>
        </div>
        <div class="progress-bg">
            <div class="progress-fill" id="globalProgressBar"></div>
        </div>
    </div>

    <!-- السعر اللحظي -->
    <div class="price-card">
        <span class="price-badge"><i class="fa-solid fa-circle-dot"></i> سعر مباشر بالثانية</span>
        <div class="price-value" id="livePrice">$0.0524</div>
    </div>

    <!-- لوحة التحويل -->
    <div class="convert-card">
        <div class="section-title" style="margin-top:0;"><i class="fa-solid fa-right-left" style="color:#10b981;"></i> تحويل العملة إلى ZNX</div>
        
        <div class="quick-options">
            <button class="opt-btn" onclick="selectOption('min')">حد أدنى</button>
            <button class="opt-btn" onclick="selectOption('half')">1/2 الرصيد</button>
            <button class="opt-btn" onclick="selectOption('max')">أقصى رصيد</button>
        </div>

        <div class="input-wrapper">
            <input type="number" id="convertInput" class="custom-input" placeholder="أدخل كمية نقاط ZN" oninput="onInputChange()">
        </div>

        <div class="preview-box">
            ستحصل على: <strong id="znxPreview" style="color:#38bdf8;">0.0000 ZNX</strong>
        </div>

        <button class="btn-action" onclick="submitConvert()">تأكيد التحويل الآن</button>
    </div>

    <!-- تفاصيل الشرائح -->
    <div class="section-title"><i class="fa-solid fa-layer-group" style="color:#38bdf8;"></i> شرائح التحويل الحالية</div>
    <div class="tiers-list" id="tiersContainer"></div>

    <!-- قائمة المتصدرين -->
    <div class="section-title"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> كبار كاسبي عملة ZNX</div>
    <div class="podium" id="podiumContainer"></div>
    <div id="rankingsContainer"></div>

    <script src="leaderboard.js"></script>
</body>
</html>
