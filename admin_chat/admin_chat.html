<div class="content-card animate-fade-in">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="color: #f59e0b; margin: 0;">💬 مركز الدردشة والدعم الفني</h2>
        <span id="unread-count-badge" style="background: #ef4444; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; display: none;">0 غير مقروء</span>
    </div>
    <p style="color: #94a3b8; font-size: 12px; margin-bottom: 16px;">متابعة استفسارات المستخدمين والرد عليها مباشرة.</p>

    <!-- قائمة التذاكر -->
    <div id="tickets-list-section">
        <!-- شريط البحث المباشر -->
        <div style="margin-bottom: 12px;">
            <input type="text" id="ticket-search-input" onkeyup="filterTickets()" placeholder="🔍 ابحث برقم التذكرة (TK-...) أو اسم المستخدم..." class="search-input" style="width: 100%; box-sizing: border-box; padding: 10px; background: #0f1117; border: 1px solid #2d3345; border-radius: 8px; color: #fff;">
        </div>

        <button onclick="fetchAdminTickets()" class="btn-refresh" style="margin-bottom: 12px; width: 100%; padding: 8px;">
            🔄 تحديث قائمة المحادثات
        </button>
        
        <div id="tickets-container">
            <p style="text-align: center; color: #94a3b8;">جاري تحميل المحادثات...</p>
        </div>
    </div>

    <!-- نافذة الشات مع مستخدم معين -->
    <div id="chat-view-section" style="display: none; margin-top: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #1f2330; padding: 10px; border-radius: 10px; border: 1px solid #2d3345;">
            <div>
                <strong id="chat-user-name" style="color: #f59e0b; font-size: 14px;">-</strong>
                <div id="chat-ticket-id" style="font-size: 11px; color: #94a3b8; margin-top: 2px;">-</div>
            </div>
            <button onclick="closeChatView()" style="background: #2d3345; color: #fff; border: 1px solid #3b4256; padding: 6px 12px; border-radius: 6px; cursor: pointer;">رجوع ↩️</button>
        </div>

        <div id="admin-chat-box" style="height: 320px; overflow-y: auto; background: #0f1117; border: 1px solid #2d3345; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
            <!-- الرسائل ستظهر هنا -->
        </div>

        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <input type="text" id="admin-reply-input" placeholder="اكتب ردك هنا..." class="search-input" style="flex: 1; padding: 10px; background: #1f2330; border: 1px solid #2d3345; border-radius: 8px; color: #fff;" onkeydown="if(event.key==='Enter') sendAdminReply()">
            <button onclick="sendAdminReply()" class="btn-refresh" style="width: auto; padding: 0 18px; background: #f59e0b; color: #000; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;">إرسال 🚀</button>
        </div>

        <button onclick="closeCurrentTicket()" style="width: 100%; margin-top: 12px; background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">
            🔒 إنهاء وإغلاق هذه التذكرة
        </button>
    </div>
</div>
