<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zn Goxe - شبكة العملات</title>
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-card: #151a23;
            --bg-card-hover: #1c2330;
            --accent-gold: #ffb800;
            --accent-gold-glow: rgba(255, 184, 0, 0.35);
            --accent-green: #00e676;
            --accent-red: #ff3d00;
            --text-main: #ffffff;
            --text-muted: #8b98a5;
            --border-color: #242e3e;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            position: fixed;
            background-color: var(--bg-primary);
            color: var(--text-main);
            touch-action: manipulation;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Top Header Balance */
        .header-balance {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .balance-pill {
            background: linear-gradient(145deg, #18202c, #111620);
            border: 1px solid var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold-glow);
            border-radius: 30px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-label {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .zn-coin-icon {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 4px var(--accent-gold));
        }

        /* Stats & Dynamic Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .stat-value.highlight {
            color: var(--accent-gold);
        }

        .stat-value.green {
            color: var(--accent-green);
        }

        /* Main Game Board Grid */
        .board-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            aspect-ratio: 5 / 5;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .box-tile {
            perspective: 1000px;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .box-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .box-tile.revealed .box-inner {
            transform: rotateY(180deg);
        }

        .box-front, .box-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box-front {
            background: linear-gradient(145deg, #1e2634, #141a24);
            border: 1px solid #2a364a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .box-front:hover {
            border-color: var(--accent-gold);
            background: linear-gradient(145deg, #242e3f, #18202d);
        }

        .box-tile.disabled .box-front {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .box-back {
            transform: rotateY(180deg);
            background: #111620;
            border: 1px solid var(--border-color);
        }

        .box-back.gold-win {
            background: radial-gradient(circle, rgba(255,184,0,0.2) 0%, rgba(21,26,35,1) 80%);
            border: 1px solid var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .box-back.bomb-lose {
            background: radial-gradient(circle, rgba(255,61,0,0.2) 0%, rgba(21,26,35,1) 80%);
            border: 1px solid var(--accent-red);
        }

        /* SVGs styling inside tiles */
        .chest-svg {
            width: 55%;
            height: 55%;
            fill: #4a5a73;
            transition: transform 0.2s;
        }

        .box-tile:active .chest-svg {
            transform: scale(0.9);
        }

        .result-svg {
            width: 70%;
            height: 70%;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Controls & Subscription Panel */
        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Broken Gray Coins Selector */
        .coins-selector {
            display: flex;
            gap: 6px;
        }

        .coin-option {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .coin-option.active {
            border-color: var(--accent-red);
            background: rgba(255, 61, 0, 0.1);
            color: #ffffff;
        }

        .mini-broken-coin {
            width: 14px;
            height: 14px;
        }

        /* Entry Amount Inputs */
        .amount-input-wrapper {
            display: flex;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .amount-input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 10px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
            text-align: center;
        }

        .quick-btn-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn-quick {
            background: #1c2432;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: #ffffff;
            padding: 6px 0;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-quick:active {
            background: #283448;
        }

        /* Buttons Section */
        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #ffb800, #ff8800);
            color: #000000;
            box-shadow: 0 4px 15px rgba(255, 184, 0, 0.3);
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        .btn-cashout {
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #000000;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        .btn-auto {
            background: #242e3e;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-auto:disabled, .btn-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Balance Header -->
    <div class="header-balance">
        <div class="balance-pill">
            <svg class="zn-coin-icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" fill="url(#goldGradient)" stroke="#ffe57f" stroke-width="4"/>
                <circle cx="50" cy="50" r="38" fill="none" stroke="#d48800" stroke-width="2" stroke-dasharray="6,3"/>
                <text x="50" y="58" font-size="28" font-weight="900" fill="#5c3a00" text-anchor="middle" font-family="Arial">ZN</text>
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffe066"/>
                        <stop offset="50%" stop-color="#ffb800"/>
                        <stop offset="100%" stop-color="#996e00"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="balance-label">ZN</span>
            <span class="balance-amount" id="balanceDisplay">67,337.17</span>
        </div>
    </div>

    <!-- Status & Multiplier Bar -->
    <div class="status-bar">
        <div class="stat-item">
            <span class="stat-title">المضاعف الحالي</span>
            <span class="stat-value highlight" id="multiplierDisplay">1.00x</span>
        </div>
        <div class="stat-item">
            <span class="stat-title">الربح التالي</span>
            <span class="stat-value green" id="nextProfitDisplay">0.00 ZN</span>
        </div>
        <div class="stat-item">
            <span class="stat-title">العملات السليمة</span>
            <span class="stat-value" id="safeFoundDisplay">0 / 22</span>
        </div>
    </div>

    <!-- Game Board -->
    <div class="board-wrapper">
        <div class="grid-container" id="gridContainer">
            <!-- 25 Boxes generated by JS -->
        </div>
    </div>

    <!-- Subscription & Entry Controls -->
    <div class="controls-panel">
        <!-- Broken Gray Coins Selection -->
        <div class="control-group">
            <div class="control-label">
                <span>عدد العملات المكسورة (الفخاخ)</span>
                <span id="riskLabel" style="color: var(--accent-red); font-weight: bold;">3 مخاطرة</span>
            </div>
            <div class="coins-selector" id="trapSelector">
                <div class="coin-option" data-traps="1">
                    <svg class="mini-broken-coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#78909c"/><path d="M 30,30 L 70,70 M 70,30 L 30,70" stroke="#37474f" stroke-width="8"/></svg>
                    1
                </div>
                <div class="coin-option active" data-traps="3">
                    <svg class="mini-broken-coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#78909c"/><path d="M 30,30 L 70,70 M 70,30 L 30,70" stroke="#37474f" stroke-width="8"/></svg>
                    3
                </div>
                <div class="coin-option" data-traps="5">
                    <svg class="mini-broken-coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#78909c"/><path d="M 30,30 L 70,70 M 70,30 L 30,70" stroke="#37474f" stroke-width="8"/></svg>
                    5
                </div>
                <div class="coin-option" data-traps="10">
                    <svg class="mini-broken-coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#78909c"/><path d="M 30,30 L 70,70 M 70,30 L 30,70" stroke="#37474f" stroke-width="8"/></svg>
                    10
                </div>
            </div>
        </div>

        <!-- Participation Amount Input -->
        <div class="control-group">
            <div class="control-label">
                <span>قيمة المشاركة</span>
            </div>
            <div class="amount-input-wrapper">
                <input type="number" class="amount-input" id="amountInput" value="500" min="10">
            </div>
        </div>

        <!-- Quick Addition Buttons -->
        <div class="quick-btn-row">
            <button class="btn-quick" onclick="adjustAmount(100)">+100</button>
            <button class="btn-quick" onclick="adjustAmount(500)">+500</button>
            <button class="btn-quick" onclick="multiplyAmount(2)">2x</button>
            <button class="btn-quick" onclick="setMaxAmount()">الأقصى</button>
        </div>

        <!-- Main Action Area -->
        <div class="action-buttons">
            <button class="btn-auto" id="autoBtn" onclick="pickRandomTile()" disabled>اختيار عشوائي</button>
            <button class="btn-main btn-start" id="mainBtn" onclick="handleMainAction()">
                بدء الجولة (ZN 500)
            </button>
        </div>
    </div>
</div>

<!-- SVG Assets Templates -->
<svg style="display: none;">
    <!-- Sleek Box/Chest SVG -->
    <g id="svg-chest">
        <path d="M 20,35 L 80,35 L 75,80 L 25,80 Z" fill="#3a4b61" stroke="#5a6e8a" stroke-width="3"/>
        <path d="M 15,20 L 85,20 L 80,35 L 20,35 Z" fill="#4a5d78" stroke="#6b82a4" stroke-width="3"/>
        <rect x="44" y="32" width="12" height="14" rx="2" fill="#ffb800"/>
        <circle cx="50" cy="38" r="2" fill="#000"/>
    </g>

    <!-- Golden ZN Coin SVG -->
    <g id="svg-gold-zn">
        <circle cx="50" cy="50" r="44" fill="url(#goldGradientTile)" stroke="#ffe57f" stroke-width="3"/>
        <circle cx="50" cy="50" r="36" fill="none" stroke="#b37400" stroke-dasharray="5,3" stroke-width="2"/>
        <text x="50" y="60" font-size="32" font-weight="900" fill="#4a2e00" text-anchor="middle" font-family="Arial">ZN</text>
        <defs>
            <linearGradient id="goldGradientTile" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fff099"/>
                <stop offset="50%" stop-color="#ffb800"/>
                <stop offset="100%" stop-color="#b37400"/>
            </linearGradient>
        </defs>
    </g>

    <!-- Broken Gray Coin (Trap) SVG -->
    <g id="svg-broken-coin">
        <circle cx="50" cy="50" r="42" fill="#455a64" stroke="#263238" stroke-width="4"/>
        <path d="M 20,20 L 45,55 L 35,80" stroke="#1c242b" stroke-width="5" fill="none"/>
        <path d="M 80,25 L 50,50 L 65,85" stroke="#1c242b" stroke-width="5" fill="none"/>
        <path d="M 25,50 L 75,45" stroke="#1c242b" stroke-width="4" fill="none"/>
        <circle cx="35" cy="35" r="4" fill="#263238"/>
        <circle cx="65" cy="65" r="5" fill="#263238"/>
    </g>
</svg>

<script>
    // Game State
    let balance = 67337.17;
    let selectedTraps = 3;
    let currentAmount = 500;
    let isGameActive = false;
    let grid = []; // 25 tiles
    let safeFound = 0;
    let currentMultiplier = 1.0;
    const TOTAL_TILES = 25;

    // DOM Elements
    const balanceDisplay = document.getElementById('balanceDisplay');
    const multiplierDisplay = document.getElementById('multiplierDisplay');
    const nextProfitDisplay = document.getElementById('nextProfitDisplay');
    const safeFoundDisplay = document.getElementById('safeFoundDisplay');
    const gridContainer = document.getElementById('gridContainer');
    const amountInput = document.getElementById('amountInput');
    const mainBtn = document.getElementById('mainBtn');
    const autoBtn = document.getElementById('autoBtn');
    const trapOptions = document.querySelectorAll('.coin-option');
    const riskLabel = document.getElementById('riskLabel');

    // Initialize Application
    function init() {
        renderGrid();
        updateUI();
        setupEventListeners();
    }

    function setupEventListeners() {
        amountInput.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 0;
            currentAmount = val;
            updateMainButtonText();
        });

        trapOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                if (isGameActive) return;
                trapOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedTraps = parseInt(opt.dataset.traps);
                riskLabel.textContent = `${selectedTraps} مخاطرة`;
                updateUI();
            });
        });
    }

    function renderGrid() {
        gridContainer.innerHTML = '';
        for (let i = 0; i < TOTAL_TILES; i++) {
            const tile = document.createElement('div');
            tile.className = 'box-tile disabled';
            tile.dataset.index = i;
            tile.innerHTML = `
                <div class="box-inner">
                    <div class="box-front">
                        <svg class="chest-svg"><use href="#svg-chest"></use></svg>
                    </div>
                    <div class="box-back" id="back-${i}"></div>
                </div>
            `;
            tile.addEventListener('click', () => handleTileClick(i));
            gridContainer.appendChild(tile);
        }
    }

    function updateUI() {
        balanceDisplay.textContent = balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const maxSafe = TOTAL_TILES - selectedTraps;
        safeFoundDisplay.textContent = `${safeFound} / ${maxSafe}`;
        updateMainButtonText();
    }

    function updateMainButtonText() {
        if (!isGameActive) {
            mainBtn.className = "btn-main btn-start";
            mainBtn.textContent = `بدء الجولة (ZN ${currentAmount})`;
            mainBtn.disabled = currentAmount <= 0 || currentAmount > balance;
        } else {
            const currentWinnings = (currentAmount * currentMultiplier).toFixed(2);
            mainBtn.className = "btn-main btn-cashout";
            mainBtn.textContent = safeFound > 0 ? `سحب الأرباح (ZN ${currentWinnings})` : 'اختر صندوقاً';
            mainBtn.disabled = safeFound === 0;
        }
    }

    function calculateMultiplier(step) {
        let mult = 1.0;
        for (let i = 0; i < step; i++) {
            mult *= (TOTAL_TILES - i) / (TOTAL_TILES - selectedTraps - i);
        }
        return mult * 0.97; // 3% house margin
    }

    function handleMainAction() {
        if (!isGameActive) {
            startRound();
        } else {
            cashout();
        }
    }

    function startRound() {
        if (currentAmount > balance || currentAmount <= 0) return;

        balance -= currentAmount;
        isGameActive = true;
        safeFound = 0;
        currentMultiplier = 1.0;

        // Generate Trap Positions
        grid = Array(TOTAL_TILES).fill('GOLD');
        let trapsPlaced = 0;
        while (trapsPlaced < selectedTraps) {
            let rand = Math.floor(Math.random() * TOTAL_TILES);
            if (grid[rand] !== 'TRAP') {
                grid[rand] = 'TRAP';
                trapsPlaced++;
            }
        }

        // Reset Tiles UI
        document.querySelectorAll('.box-tile').forEach((tile, idx) => {
            tile.classList.remove('revealed', 'disabled');
            const backEl = document.getElementById(`back-${idx}`);
            backEl.className = 'box-back';
            backEl.innerHTML = '';
        });

        // Lock trap selector buttons during active game
        trapOptions.forEach(opt => opt.style.pointerEvents = 'none');
        amountInput.disabled = true;
        autoBtn.disabled = false;

        multiplierDisplay.textContent = '1.00x';
        const nextMult = calculateMultiplier(1);
        nextProfitDisplay.textContent = `${(currentAmount * nextMult).toFixed(2)} ZN`;

        updateUI();
    }

    function handleTileClick(index) {
        if (!isGameActive) return;
        const tile = gridContainer.children[index];
        if (tile.classList.contains('revealed')) return;

        tile.classList.add('revealed');
        const backEl = document.getElementById(`back-${index}`);

        if (grid[index] === 'GOLD') {
            backEl.classList.add('gold-win');
            backEl.innerHTML = `<svg class="result-svg"><use href="#svg-gold-zn"></use></svg>`;
            safeFound++;
            currentMultiplier = calculateMultiplier(safeFound);

            const nextMult = calculateMultiplier(safeFound + 1);
            multiplierDisplay.textContent = `${currentMultiplier.toFixed(2)}x`;
            nextProfitDisplay.textContent = `${(currentAmount * nextMult).toFixed(2)} ZN`;

            if (safeFound === TOTAL_TILES - selectedTraps) {
                cashout();
            } else {
                updateUI();
            }
        } else {
            // Hit Broken Gray Coin Trap
            backEl.classList.add('bomb-lose');
            backEl.innerHTML = `<svg class="result-svg"><use href="#svg-broken-coin"></use></svg>`;
            endRound(false);
        }
    }

    function pickRandomTile() {
        if (!isGameActive) return;
        let available = [];
        document.querySelectorAll('.box-tile').forEach((tile, idx) => {
            if (!tile.classList.contains('revealed')) {
                available.push(idx);
            }
        });
        if (available.length > 0) {
            let randIndex = available[Math.floor(Math.random() * available.length)];
            handleTileClick(randIndex);
        }
    }

    function cashout() {
        const winAmount = currentAmount * currentMultiplier;
        balance += winAmount;
        endRound(true);
    }

    function endRound(isWin) {
        isGameActive = false;
        autoBtn.disabled = true;
        amountInput.disabled = false;
        trapOptions.forEach(opt => opt.style.pointerEvents = 'auto');

        // Reveal remaining grid
        document.querySelectorAll('.box-tile').forEach((tile, idx) => {
            tile.classList.add('disabled');
            if (!tile.classList.contains('revealed')) {
                tile.classList.add('revealed');
                const backEl = document.getElementById(`back-${idx}`);
                if (grid[idx] === 'GOLD') {
                    backEl.classList.add('gold-win');
                    backEl.innerHTML = `<svg class="result-svg" style="opacity:0.5;"><use href="#svg-gold-zn"></use></svg>`;
                } else {
                    backEl.classList.add('bomb-lose');
                    backEl.innerHTML = `<svg class="result-svg"><use href="#svg-broken-coin"></use></svg>`;
                }
            }
        });

        if (!isWin) {
            multiplierDisplay.textContent = '0.00x';
            nextProfitDisplay.textContent = '0.00 ZN';
        }

        updateUI();
    }

    // Amount Adjusters
    function adjustAmount(val) {
        if (isGameActive) return;
        currentAmount = Math.max(10, currentAmount + val);
        amountInput.value = currentAmount;
        updateMainButtonText();
    }

    function multiplyAmount(factor) {
        if (isGameActive) return;
        currentAmount = Math.max(10, currentAmount * factor);
        amountInput.value = currentAmount;
        updateMainButtonText();
    }

    function setMaxAmount() {
        if (isGameActive) return;
        currentAmount = Math.floor(balance);
        amountInput.value = currentAmount;
        updateMainButtonText();
    }

    window.onload = init;
</script>
</body>
</html>
