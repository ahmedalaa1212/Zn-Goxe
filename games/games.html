<div class="games-container">
    <!-- Header: الرصيد في الأعلى -->
    <div class="games-header">
        <div class="balance-badge">
            <span class="balance-title">ZN</span>
            <span id="user-zn-balance" class="balance-amount">0.00</span>
            <span class="coin-icon">🪙</span>
        </div>
    </div>

    <!-- Top Navigation Tabs: التبويب العلوي معزول -->
    <div class="game-tabs-nav">
        <button id="tab-btn-arena" class="game-tab-btn active" onclick="switchGameTab('arena')">
            ⚔️ الساحة الكبرى
        </button>
        <button id="tab-btn-boxes" class="game-tab-btn" onclick="switchGameTab('boxes')">
            📦 شبكة ZN Go
        </button>
    </div>

    <!-- ==================== LOBBY 1: الساحة الكبرى ==================== -->
    <div id="game-view-arena" class="game-view-section active">
        <div class="arena-card main-timer-card">
            <div class="card-header-label">الوقت المتبقي للسحب</div>
            <div id="arena-timer" class="big-countdown">05:00</div>
            
            <div class="prize-pool-box">
                <span class="trophy-icon">🏆</span>
                <span class="pool-label">مجمع الجوائز الحالي</span>
                <div id="prize-pool" class="pool-amount">ZN 0.00</div>
            </div>

            <button id="btn-join-arena" class="btn-primary-action" onclick="joinArenaGame()">
                ⚔️ دخول الساحة (350 ZN)
            </button>
        </div>

        <!-- جدول توزيع الجوائز -->
        <div class="arena-card prizes-breakdown-card">
            <h3>📊 توزيع جوائز الساحة (Top 10)</h3>
            <p class="sub-text">توزيع المبلغ الجمعي المجمع للمشاركين حسب المراكز</p>
            <div id="arena-prizes-list" class="prizes-list">
                <!-- يتم توليده تلقائياً عبر JS -->
            </div>
        </div>
    </div>

    <!-- ==================== LOBBY 2: شبكة ZN Go ==================== -->
    <div id="game-view-boxes" class="game-view-section">
        <div class="arena-card boxes-main-card">
            <div class="card-header-label">🎁 لعبة اختيار الصناديق ZN Go</div>
            <p class="sub-text">اختر صندوقك واكشف عن مضاعف رصيدك!</p>
            
            <div class="bet-controls">
                <label>مبلغ الرهان:</label>
                <input type="number" id="boxes-bet-input" value="100" min="10" step="10" />
            </div>

            <div id="boxes-grid" class="boxes-grid-container">
                <!-- 9 صناديق تفاعلية -->
                <div class="box-item" onclick="openBox(0)">📦</div>
                <div class="box-item" onclick="openBox(1)">📦</div>
                <div class="box-item" onclick="openBox(2)">📦</div>
                <div class="box-item" onclick="openBox(3)">📦</div>
                <div class="box-item" onclick="openBox(4)">📦</div>
                <div class="box-item" onclick="openBox(5)">📦</div>
                <div class="box-item" onclick="openBox(6)">📦</div>
                <div class="box-item" onclick="openBox(7)">📦</div>
                <div class="box-item" onclick="openBox(8)">📦</div>
            </div>

            <button id="btn-reset-boxes" class="btn-secondary-action" onclick="resetBoxesGame()">
                🔄 إعادة تعيين الصناديق
            </button>
        </div>
    </div>
</div>

<script src="/games/games-core.js"></script>
<script src="/games/arena-game.js"></script>
<script src="/games/boxes-game.js"></script>
