<style>
    .goxe-container {
        background: radial-gradient(circle at top, #1a2332 0%, #0d1117 100%);
        border: 1px solid #30363d;
        border-radius: 20px;
        padding: 20px 15px;
        color: #ffffff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        max-width: 480px;
        margin: 0 auto;
        font-family: inherit;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
    }

    .goxe-header {
        text-align: center;
        margin-bottom: 15px;
        position: relative;
    }

    .goxe-title {
        font-size: 24px;
        font-weight: 900;
        color: #00f2fe;
        text-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        letter-spacing: 0.5px;
    }

    .goxe-subtitle {
        font-size: 12px;
        color: #8b949e;
        margin-top: 4px;
    }

    /* برج الأدوار */
    .goxe-tower {
        display: flex;
        flex-direction: column-reverse;
        gap: 10px;
        margin: 15px 0;
        max-height: 400px;
        min-height: 280px;
        overflow-y: auto;
        padding: 6px 4px;
        perspective: 1000px;
    }

    /* تأثير اهتزاز البرج عند الانفجار */
    .goxe-tower.shake-tower {
        animation: towerShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes towerShake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
        40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .tower-floor {
        background: rgba(22, 27, 34, 0.85);
        border: 1px solid #21262d;
        border-radius: 14px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
    }

    .tower-floor.active-floor {
        border-color: #00f2fe;
        background: rgba(0, 242, 254, 0.12);
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        transform: scale(1.02);
    }

    .tower-floor.passed-floor {
        border-color: #238636;
        background: rgba(35, 134, 54, 0.18);
    }

    .floor-info {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: bold;
    }

    .floor-badge {
        background: #21262d;
        color: #8b949e;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 11px;
    }

    .active-floor .floor-badge {
        background: #00f2fe;
        color: #0d1117;
        font-weight: 800;
    }

    .floor-multiplier {
        color: #f1e05a;
        font-weight: 800;
        font-size: 14px;
        text-shadow: 0 0 8px rgba(241, 224, 90, 0.3);
    }

    /* الأبواب وتأثيرات 3D */
    .floor-doors {
        display: flex;
        gap: 8px;
    }

    .door-wrapper {
        perspective: 600px;
        width: 42px;
        height: 40px;
    }

    .door-btn {
        width: 100%;
        height: 100%;
        background: #21262d;
        border: 1px solid #30363d;
        color: #ffffff;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, border-color 0.3s, box-shadow 0.3s;
        transform-style: preserve-3d;
        user-select: none;
    }

    .door-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .active-floor .door-btn:not(:disabled) {
        border-color: #00f2fe;
        background: rgba(0, 242, 254, 0.2);
        box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
    }

    .active-floor .door-btn:not(:disabled):hover {
        transform: scale(1.08) translateY(-2px);
        background: rgba(0, 242, 254, 0.35);
        box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    }

    .active-floor .door-btn:not(:disabled):active {
        transform: scale(0.92);
    }

    /* أنيميشن كشف الأبواب */
    .door-btn.door-opening {
        animation: flipDoor 0.4s forwards;
    }

    .door-btn.door-safe {
        background: linear-gradient(135deg, #2ea043, #238636) !important;
        border-color: #3fb950 !important;
        box-shadow: 0 0 15px rgba(63, 185, 80, 0.6) !important;
        animation: safeGlow 0.5s ease-in-out alternate infinite;
    }

    .door-btn.door-bomb {
        background: linear-gradient(135deg, #da3633, #b62324) !important;
        border-color: #f85149 !important;
        box-shadow: 0 0 18px rgba(248, 81, 73, 0.8) !important;
        animation: bombPulse 0.3s ease-in-out 2;
    }

    @keyframes flipDoor {
        0% { transform: rotateY(0deg); }
        50% { transform: rotateY(90deg); scale: 1.1; }
        100% { transform: rotateY(0deg); }
    }

    @keyframes safeGlow {
        from { box-shadow: 0 0 8px rgba(63, 185, 80, 0.4); }
        to { box-shadow: 0 0 18px rgba(63, 185, 80, 0.9); }
    }

    @keyframes bombPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    /* لوحة التحكم والاشتراك */
    .goxe-controls {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 16px;
        padding: 16px;
        margin-top: 15px;
    }

    .bet-label {
        font-size: 12px;
        color: #8b949e;
        margin-bottom: 10px;
        text-align: right;
        font-weight: bold;
    }

    .bet-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 14px;
        min-height: 80px;
    }

    .bet-chip {
        background: #21262d;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 12px 4px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
        user-select: none;
    }

    .bet-chip:hover {
        border-color: #58a6ff;
        transform: translateY(-1px);
    }

    .bet-chip.selected {
        background: rgba(0, 242, 254, 0.15);
        border-color: #00f2fe;
        color: #00f2fe;
        box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
    }

    .bet-loading-skeleton {
        grid-column: span 3;
        text-align: center;
        color: #8b949e;
        font-size: 13px;
        padding: 15px;
    }

    .action-btn {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        user-select: none;
    }

    .start-btn {
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        color: #0d1117;
        box-shadow: 0 4px 18px rgba(0, 242, 254, 0.35);
    }

    .start-btn:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 22px rgba(0, 242, 254, 0.5);
    }

    .cashout-btn {
        background: linear-gradient(135deg, #2ea043, #238636);
        color: #ffffff;
        box-shadow: 0 4px 18px rgba(46, 160, 67, 0.45);
    }

    .cashout-btn:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 22px rgba(46, 160, 67, 0.6);
    }

    .action-btn:disabled {
        background: #21262d;
        color: #8b949e;
        box-shadow: none;
        cursor: not-allowed;
        transform: none !important;
    }
</style>

<div class="goxe-container">
    <div class="goxe-header">
        <h2 class="goxe-title"><i class="fas fa-building"></i> برج النيون - Goxe</h2>
        <div class="goxe-subtitle">تسلق الأدوار، تفادى القنابل، واكتسح المضاعف!</div>
    </div>

    <!-- برج الأدوار العشرة -->
    <div id="goxe-tower" class="goxe-tower">
        <!-- يتم رسم الأدوار فوراً بالجافاسكريبت -->
    </div>

    <!-- لوحة التحكم وااختيار الاشتراك -->
    <div class="goxe-controls">
        <div id="goxe-bet-section">
            <div class="bet-label">اختر مبلغ الاشتراك في الجولة:</div>
            <!-- تم إزالة الأرقام الثابتة لمنع ظهور أرقام قديمة قبل التحميل -->
            <div id="goxe-bet-grid" class="bet-grid">
                <div class="bet-loading-skeleton">⏳ جاري جلب الخيارات...</div>
            </div>
        </div>

        <button id="goxe-main-btn" class="action-btn start-btn" onclick="handleGoxeMainAction()" disabled>
            ⏳ جاري التحميل...
        </button>
    </div>
</div>
