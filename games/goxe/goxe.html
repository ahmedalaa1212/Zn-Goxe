<style>
    .goxe-container {
        background: radial-gradient(circle at top, #1a2332 0%, #0d1117 100%);
        border: 1px solid #30363d;
        border-radius: 20px;
        padding: 20px 15px;
        color: #ffffff;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        max-width: 480px;
        margin: 0 auto;
        font-family: inherit;
        box-sizing: border-box;
    }

    .goxe-header {
        text-align: center;
        margin-bottom: 15px;
    }

    .goxe-title {
        font-size: 22px;
        font-weight: 800;
        color: #00f2fe;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .goxe-subtitle {
        font-size: 12px;
        color: #8b949e;
        margin-top: 4px;
    }

    /* برج الأدوار */
    .goxe-tower {
        display: flex;
        flex-direction: column-reverse;
        gap: 8px;
        margin: 15px 0;
        max-height: 380px;
        min-height: 280px;
        overflow-y: auto;
        padding-right: 4px;
    }

    .tower-floor {
        background: rgba(22, 27, 34, 0.8);
        border: 1px solid #21262d;
        border-radius: 12px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.3s ease;
    }

    .tower-floor.active-floor {
        border-color: #00f2fe;
        background: rgba(0, 242, 254, 0.1);
        box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .tower-floor.passed-floor {
        border-color: #238636;
        background: rgba(35, 134, 54, 0.15);
    }

    .floor-info {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: bold;
    }

    .floor-badge {
        background: #21262d;
        color: #8b949e;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
    }

    .active-floor .floor-badge {
        background: #00f2fe;
        color: #0d1117;
    }

    .floor-multiplier {
        color: #f1e05a;
        font-weight: 800;
        font-size: 14px;
    }

    /* أبواب الدور */
    .floor-doors {
        display: flex;
        gap: 6px;
    }

    .door-btn {
        background: #21262d;
        border: 1px solid #30363d;
        color: #ffffff;
        width: 38px;
        height: 36px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s, background 0.2s;
    }

    .door-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .door-btn:not(:disabled):active {
        transform: scale(0.92);
    }

    .active-floor .door-btn {
        border-color: #00f2fe;
        background: rgba(0, 242, 254, 0.2);
    }

    /* لوحة التحكم وشبكة اختيار سعر الاشتراك */
    .goxe-controls {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 14px;
        margin-top: 15px;
    }

    .bet-label {
        font-size: 12px;
        color: #8b949e;
        margin-bottom: 8px;
        text-align: right;
        font-weight: bold;
    }

    .bet-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
    }

    .bet-chip {
        background: #21262d;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 10px 4px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
        user-select: none;
    }

    .bet-chip:hover {
        border-color: #58a6ff;
    }

    .bet-chip.selected {
        background: rgba(0, 242, 254, 0.15);
        border-color: #00f2fe;
        color: #00f2fe;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .action-btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .start-btn {
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        color: #0d1117;
        box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .cashout-btn {
        background: linear-gradient(135deg, #2ea043, #238636);
        color: #ffffff;
        box-shadow: 0 4px 15px rgba(46, 160, 67, 0.4);
    }

    .action-btn:disabled {
        background: #21262d;
        color: #8b949e;
        box-shadow: none;
        cursor: not-allowed;
    }
</style>

<div class="goxe-container">
    <div class="goxe-header">
        <h2 class="goxe-title"><i class="fas fa-building"></i> برج النيون - Goxe</h2>
        <div class="goxe-subtitle">تسلق الأدوار، تفادى القنابل، واكتسح المضاعف!</div>
    </div>

    <!-- برج الأدوار العشرة -->
    <div id="goxe-tower" class="goxe-tower">
        <!-- يتم رسم الأدوار فوراً بالجافاسكريبت -->
    </div>

    <!-- لوحة التحكم واختيار الاشتراك -->
    <div class="goxe-controls">
        <div id="goxe-bet-section">
            <div class="bet-label">اختر مبلغ الاشتراك في الجولة:</div>
            <div class="bet-grid">
                <div class="bet-chip" onclick="selectGoxeBet(10)">10 ZN</div>
                <div class="bet-chip" onclick="selectGoxeBet(50)">50 ZN</div>
                <div class="bet-chip selected" id="default-bet-chip" onclick="selectGoxeBet(100)">100 ZN</div>
                <div class="bet-chip" onclick="selectGoxeBet(200)">200 ZN</div>
                <div class="bet-chip" onclick="selectGoxeBet(500)">500 ZN</div>
                <div class="bet-chip" onclick="selectGoxeBet(1000)">1000 ZN</div>
            </div>
        </div>

        <button id="goxe-main-btn" class="action-btn start-btn" onclick="handleGoxeMainAction()">
            🚀 بدء التسلق (100 ZN)
        </button>
    </div>
</div>

<script src="games/goxe/goxe.js?v=3.0"></script>
