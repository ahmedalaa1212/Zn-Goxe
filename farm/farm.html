<div class="farm-container" style="padding: 20px; direction: rtl; font-family: sans-serif; padding-bottom: 90px;">
    
    <div style="display: flex; justify-content: space-between; padding: 15px; background: #1a1a1a; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333;">
        <div id="farm-rate" style="color: #ffcc00; font-weight: bold; font-size: 16px;">⚡ 0/س</div>
        <div id="farm-balance" style="color: #ffcc00; font-weight: bold; font-size: 16px;">ZN: 0</div>
    </div>

    <!-- 🟢 تعديل منطقة العملة عشان يكون جنبها زرار التسريع -->
    <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 25px;">
        
        <!-- زرار تسريع التعدين (دايرة) -->
        <button id="boost-btn" onclick="handleDailyBoost()" style="width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #ff8c00, #ff0080); border: 2px solid #fff; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 0, 128, 0.5); transition: 0.2s;">

            <span style="font-size: 11px; font-weight: bold;">+1/س</span>
        </button>

        <!-- العملة ثلاثية الأبعاد -->
        <div style="perspective: 1000px;">
            <div class="coin-3d">ZN</div>
        </div>
        
        <!-- مسافة وهمية عشان العملة تفضل في النص بالظبط -->
        <div style="width: 65px;"></div>
    </div>
    
    <div style="width: 100%; background: #333; height: 20px; border-radius: 10px; overflow: hidden; margin-bottom: 8px; border: 1px solid #444;">
        <div id="storage-progress" style="width: 0%; height: 100%; transition: width 0.3s, background 0.3s; background: linear-gradient(90deg, #0088cc, #00bfff);"></div >
    </div>
    <div id="storage-text" style="text-align: center; font-size: 14px; color: #ccc; margin-bottom: 15px; font-weight: bold;">
        0 / 0

    <button id="claim-btn" onclick="handleClaim()" style="width: 100%; padding: 15px; background: #0088cc; border: none; color: white; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;">
        تجميع الرصيد 📺
    </button>

    <div style="margin-bottom: 25px;">
        <div style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 12px;">⚡ ترقيات ومستويات التعدين</div>
        <div id="mining-fields" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
    </div>

    <div style="background: #1a1a1a; border-radius: 12px; border: 1px solid #333; padding: 15px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="color: #fff; font-weight: bold; font-size: 15px;">📅 التسجيل الشهري (30 يوم)</span>
        </div>
        
        <div id="daily-rewards-container" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;"></div>
    </div>
</div>
