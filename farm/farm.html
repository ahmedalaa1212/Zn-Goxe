<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الأصدقاء</title>
    <!-- استدعاء مكتبة تليجرام (مهم جداً) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../style.css"> 
</head>
<body>
    <div class="app-container">
        <!-- الرصيد العلوي -->
        <div class="balance-section">
            <h2>🤝 نظام الأصدقاء</h2>
            <div class="main-balance" id="top-balance-friends">ZN: 0</div>
        </div>

        <!-- إحصائيات الأصدقاء -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-title">إجمالي الأصدقاء</span>
                <span class="stat-value" id="invited-friends-count">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">أرباح معلقة للسحب</span>
                <span class="stat-value" id="pending-ref-earnings">0</span>
            </div>
        </div>

        <!-- رابط الدعوة -->
        <div class="ref-link-section section-box">
            <h3>🔗 رابط الدعوة الخاص بك</h3>
            <div class="input-group">
                <input type="text" id="ref-link-input" value="...جاري التحميل" readonly>
                <button onclick="copyRefLink()" class="copy-btn">نسخ الرابط</button>
            </div>
        </div>

        <!-- سحب الأرباح -->
        <div class="claim-section section-box">
            <h3>💰 سحب أرباح الأصدقاء</h3>
            <p class="note">* يتم خصم 1.5% رسوم تحويل عند السحب إلى الرصيد الأساسي.</p>
            <button id="btn-claim-ref" class="action-btn" onclick="claimRefEarnings()" disabled>سحب الأرباح الآن</button>
        </div>

        <!-- مكافآت الإنجازات -->
        <div class="tasks-section section-box">
            <h3>🎁 مكافآت الإنجازات (المهام)</h3>
            <ul id="ref-tasks-list" class="tasks-list">
                <!-- سيتم ملؤها عبر الجافاسكريبت -->
            </ul>
        </div>

        <!-- سجل الأصدقاء -->
        <div class="friends-list-section section-box">
            <h3>👥 سجل أصدقائك</h3>
            <div id="friends-list-container">
                <p style="text-align:center; color:#888;">...جاري التحميل</p>
            </div>
        </div>
    </div>

    <!-- استدعاء ملف الجافاسكريبت -->
    <script src="friends.js"></script>
</body>
</html>
