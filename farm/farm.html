<!-- الخدعة البرمجية لإجبار المتصفح على تشغيل التزامن والاسكربت -->
<img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" 
     onload="if(typeof initFarm === 'function') { initFarm(); } else { let s = document.createElement('script'); s.src = 'farm/farm.js?v=' + Date.now(); document.body.appendChild(s); }" 
     style="display:none;" alt="">

<div class="farm-container" style="padding: 20px; direction: rtl; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 110px; max-width: 600px; margin: auto; box-sizing: border-box;">
    
    <!-- شريط الرصيد ومعدل التعدين -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1a1a1a; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333;">
        <div id="farm-rate" style="color: #f39c12; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 6px;">
            ⚡ <span data-bind="hourly_rate">0</span>/h
        </div>
        <div id="farm-balance" class="user-balance zn-balance-display" style="color: #f39c12; font-weight: bold; font-size: 16px;">
            ZN: <span data-bind="balance">0</span>
        </div>
    </div>

    <!-- القسم الأوسط: العملة وأزرار التعزيز -->
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 25px;">
        <!-- زر تسريع التعدين اليومي -->
        <button id="boost-btn" disabled class="btn-cooldown" onclick="handleDailyBoost()" style="width: 70px; height: 70px; border-radius: 50%; border: 1px solid #444; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; outline: none;">
            <span id="boost-icon" style="font-size: 22px; margin-bottom: 2px;">🚀</span>
            <span id="boost-text" style="font-size: 10px; font-weight: bold;">+1/h</span>
        </button>

        <!-- مجسم العملة (بتصميم هادي ومريح) -->
        <div class="coin-3d">ZN</div>
        
        <!-- موازن الهيكل -->
        <div style="width: 70px;"></div> 
    </div>
    
    <!-- شريط تخزين العملات المجمعة -->
    <div style="width: 100%; background: #222; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 8px; border: 1px solid #333;">
        <div id="storage-progress" style="width: 0%; height: 100%; transition: width 0.3s ease; background: #f39c12;"></div>
    </div>
    <div id="storage-text" style="text-align: center; font-size: 13px; color: #bbb; margin-bottom: 18px; font-weight: bold;">
        <span dir="ltr">0 / 100</span>
    </div>
    
    <!-- زر تجميع التعدين (تم تكبيره وتوضيحه) -->
    <button id="claim-btn" disabled class="btn-cooldown" onclick="handleClaim()" style="width: 100%; padding: 18px; border: none; color: white; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-bottom: 25px; transition: 0.2s; outline: none;">
        تجميع الرصيد 💰
    </button>

    <!-- قائمة ترقيات أجهزة التعدين -->
    <div style="margin-bottom: 25px;">
        <div style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
            ⚡ ترقيات ومستويات التعدين <span style="font-size: 12px; color: #888;">(أقصى حد: 10 لكل مستوى)</span>
        </div>
        <div id="mining-fields" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
    </div>

    <!-- سجل المكافآت اليومية -->
    <div style="background: #1a1a1a; border-radius: 12px; border: 1px solid #333; padding: 15px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #2a2a2a; padding-bottom: 10px;">
            <span style="color: #fff; font-weight: bold; font-size: 14px;">📅 المكافآت اليومية (30 يوم)</span>
        </div>
        <div id="daily-rewards-container" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;"></div>
    </div>
</div>

<style>
/* تصميم بسيط وهادي */
.coin-3d {
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, #f1c40f, #f39c12);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: bold;
    color: #fff;
    border: 3px solid #f39c12;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
}

#boost-btn:active:not(:disabled) { transform: scale(0.95); }
#claim-btn:active:not(:disabled) { transform: scale(0.97); }

.btn-cooldown { 
    background: #2a2a2a !important; 
    cursor: not-allowed !important; 
    color: #777 !important; 
    border: 1px solid #333 !important;
}

.btn-ready { 
    background: #27ae60 !important; 
    color: #fff !important;
}

.timer-text { 
    font-size: 10px !important; 
    font-weight: bold; 
    color: #bbb; 
}

.mining-card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
}

.mining-card:hover { border-color: #f39c12; }

.mining-card-title {
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 4px;
}

.mining-card-level {
    color: #f39c12;
    font-size: 11px;
    margin-bottom: 6px;
}

.mining-card-btn {
    width: 100%;
    padding: 6px 0;
    border: none;
    border-radius: 4px;
    background: #f39c12;
    color: #000;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
}

.mining-card-btn:disabled {
    background: #333;
    color: #777;
    cursor: not-allowed;
}

.reward-day-card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    color: #aaa;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.reward-day-card.claimed {
    background: #1a251e;
    border-color: #27ae60;
    color: #2ecc71;
}

.reward-day-card.active {
    background: #2a2418;
    border-color: #f39c12;
    color: #f1c40f;
}

.reward-day-card .day-title { font-weight: bold; font-size: 10px; }
.reward-day-card .day-amount { color: #fff; font-weight: bold; }
</style>
