<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة تحكم ZN</title>
    <link rel="stylesheet" href="admin_style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- شاشة الحماية والتحقق -->
    <div id="accessDenied" class="security-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; padding:20px;">
        <h2 style="color:#f59e0b; font-size:18px;">⏳ جاري التحقق من الهوية والصلاحيات...</h2>
    </div>

    <!-- لوحة التحكم الرئيسيّة -->
    <div id="adminPanel" class="dashboard-container" style="display: none;">
        
        <!-- القائمة السفلية -->
        <div class="sidebar" id="sidebarMenu">
            <button id="btn_super_admin" onclick="loadSuperAdminSection(this)">
                <span class="icon">👨‍💻</span>
                <span>الإدارة العليا</span>
            </button>
            
            <button onclick="loadSection('users', this)">
                <span class="icon">👥</span>
                <span>بيانات المستخدم</span>
            </button>
            
            <button onclick="loadSection('admin_chat', this)">
                <span class="icon">💬</span>
                <span>الدردشة والدعم</span>
            </button>
            
            <button onclick="loadSection('settings', this)">
                <span class="icon">⚙️</span>
                <span>الإعدادات</span>
            </button>
            
            <button onclick="loadSection('transactions', this)">
                <span class="icon">💰</span>
                <span>سجل التحويلات</span>
            </button>
            
            <button onclick="loadSection('security', this)">
                <span class="icon">🛡️</span>
                <span>التحكم والأمان</span>
            </button>
            
            <button onclick="loadSection('ads', this)">
                <span class="icon">📢</span>
                <span>الإعلانات</span>
            </button>
        </div>

        <!-- مساحة العرض الرئيسية -->
        <div class="main-content" id="contentArea">
            <div class="content-card animate-fade-in">
                <h2 style="color: #f59e0b; margin-bottom: 8px;" id="welcomeTitle">مرحباً بك يا مدير 👋</h2>
                <p style="color: #94a3b8; font-size: 13px;">اختر قسماً من القائمة بالأسفل لبدء التحكم في اللعبة.</p>
            </div>
        </div>

    </div>

    <script src="main.js"></script>
    
    <!-- كود القفل الفوري والمباشر للحسابات المحذوفة -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            const initData = tg?.initData || '';
            const accessDeniedEl = document.getElementById('accessDenied');
            const adminPanelEl = document.getElementById('adminPanel');

            try {
                const response = await fetch('/api/verify_admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    },
                    body: JSON.stringify({ initData: initData })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (accessDeniedEl) accessDeniedEl.style.display = 'none';
                    if (adminPanelEl) adminPanelEl.style.display = 'block';
                } else {
                    // حظر قاطع لمن اتسحبت منه الصلاحيات
                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0d1117; color:#ef4444; font-family:sans-serif; text-align:center; padding:20px; direction:rtl;">
                            <h1 style="font-size:56px; margin-bottom:10px;">⛔</h1>
                            <h2 style="font-size:22px; color:#ef4444; margin-bottom:12px; font-weight:bold;">تم رفض الوصول!</h2>
                            <p style="color:#94a3b8; font-size:14px; max-width:380px; line-height:1.6;">عذراً، هذا الحساب غير مصرح له بدخول لوحة التحكم الإدارية. إذا كنت مشرفاً سابقاً فقد تم سحب صلاحياتك من قاعدة البيانات.</p>
                        </div>
                    `;
                }
            } catch (err) {
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0d1117; color:#ef4444; font-family:sans-serif; text-align:center; padding:20px; direction:rtl;">
                        <h1 style="font-size:56px; margin-bottom:10px;">⚠️</h1>
                        <h2 style="font-size:20px; color:#ef4444; margin-bottom:10px;">خطأ في التحقق الأمني</h2>
                        <p style="color:#94a3b8; font-size:14px;">فشل الاتصال بالسيرفر للتحقق من هوية المشرف.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
