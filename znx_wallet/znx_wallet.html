<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>محفظة ZNX وتحويل العملات ومتصدرين</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #131926;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0284c7;
            --accent-gold: #d97706;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-main);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        .dec {
            font-size: 0.72em;
            opacity: 0.8;
            font-weight: normal;
        }

        .top-balance-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .balance-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
        }

        .balance-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .balance-amount {
            font-size: 0.88rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .global-stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .progress-bg {
            background: #090d16;
            border-radius: 8px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* كارت التداول والرسم البياني الاحترافي */
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .pair-title {
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dex-tag {
            font-size: 0.65rem;
            background: rgba(2, 132, 199, 0.15);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(2, 132, 199, 0.3);
        }

        .live-price-big {
            font-size: 1.4rem;
            font-weight: bold;
            direction: ltr;
            text-align: right;
            transition: color 0.3s ease;
        }

        .price-up { color: var(--accent-green) !important; }
        .price-down { color: var(--accent-red) !important; }

        .market-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 10px 0;
            background: #090d16;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            text-align: center;
        }

        .stat-item-val {
            font-weight: bold;
            color: #e2e8f0;
            margin-top: 2px;
            direction: ltr;
        }

        .chart-container-box {
            position: relative;
            width: 100%;
            height: 310px;
            border-radius: 8px;
            overflow: hidden;
            background: #090d16;
            border: 1px solid var(--border-color);
        }

        .chart-container-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .ston-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: #1e293b;
            color: #38bdf8;
            text-decoration: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: bold;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .ston-link-btn:active {
            background: #334155;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .convert-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .quick-options {
            display: block;
            margin: 10px 0;
        }

        .opt-btn-full {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 9px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .opt-btn-full:active {
            background: #334155;
            border-color: #0284c7;
        }

        .custom-input {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
        }

        .custom-input:focus {
            border-color: #0284c7;
        }

        .preview-box {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin: 6px 0;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 0.88rem;
            font-weight: bold;
            margin: 12px 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            color: #cbd5e1;
        }

        .top10-badge {
            font-size: 0.7rem;
            background: rgba(217, 119, 6, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(217, 119, 6, 0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .my-rank-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #0284c7;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .my-rank-banner.in-top10 {
            border-color: #f59e0b;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
            background: linear-gradient(135deg, #271e11, #0f172a);
        }

        .my-rank-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .my-rank-badge {
            font-size: 0.72rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .my-rank-banner.in-top10 .my-rank-badge {
            color: #fbbf24;
        }

        .my-rank-name {
            font-size: 0.88rem;
            font-weight: bold;
            color: #fff;
        }

        .my-rank-right {
            text-align: left;
        }

        .my-rank-earned {
            font-size: 0.9rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .my-rank-sub {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .is-me-row {
            border-color: #0284c7 !important;
            background: rgba(2, 132, 199, 0.1) !important;
        }

        .me-tag {
            font-size: 0.7rem;
            color: #38bdf8;
            font-weight: bold;
            margin-right: 4px;
        }

        .tiers-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tier-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .tier-item.current {
            border: 1px solid var(--accent-gold);
            background: rgba(217, 119, 6, 0.06);
        }

        .tier-badge-active {
            background: var(--accent-gold);
            color: #fff;
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            margin: 12px 0;
        }

        .podium-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            flex: 1;
        }

        .podium-1 { border-color: var(--accent-gold); height: 85px; }
        .podium-2 { border-color: #64748b; height: 72px; }
        .podium-3 { border-color: #b45309; height: 68px; }

        .leader-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- الشريط الأعلى (الرصيد الثلاثي) -->
    <div class="top-balance-bar">
        <div class="balance-box">
            <div class="balance-title"><i class="fa-solid fa-coins" style="color:#d97706;"></i> ZN</div>
            <div class="balance-amount" id="znBalance" style="color:#d97706;">0</div>
        </div>
        <div class="balance-box">
            <div class="balance-title"><i class="fa-solid fa-wallet" style="color:#059669;"></i> USD</div>
            <div class="balance-amount" id="usdBalance" style="color:#059669;">$0.00</div>
        </div>
        <div class="balance-box">
            <div class="balance-title"><i class="fa-solid fa-bolt" style="color:#0284c7;"></i> ZNX</div>
            <div class="balance-amount" id="znxBalance" style="color:#0284c7;">0</div>
        </div>
    </div>

    <!-- مجمّع الإجمالي العام -->
    <div class="global-stats-card">
        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
            <span><i class="fa-solid fa-globe"></i> إجمالي العملات المستخرجة كلياً</span>
            <span id="globalRatioText" style="color:#0284c7; font-weight:bold;">0 / 32.5M ZNX</span>
        </div>
        <div class="progress-bg">
            <div class="progress-fill" id="globalProgressBar"></div>
        </div>
    </div>

    <!-- شاشة التداول والرسم البياني اللحظي (DEX Chart) -->
    <div class="chart-card">
        <div class="chart-header">
            <div class="pair-title">
                <i class="fa-solid fa-chart-line" style="color:#10b981;"></i>
                <span>ZNX / USD</span>
                <span class="dex-tag"><span class="pulse-dot"></span> STON.fi DEX</span>
            </div>
            <div class="live-price-big" id="livePrice">جاري التحديث...</div>
        </div>

        <!-- شريط الإحصائيات (24h Stats) -->
        <div class="market-stats-grid">
            <div>
                <div style="color:var(--text-muted);">تغير 24h</div>
                <div class="stat-item-val" id="statChange24h">0.00%</div>
            </div>
            <div>
                <div style="color:var(--text-muted);">أعلى سعر 24h</div>
                <div class="stat-item-val" id="statHigh24h">$0.00</div>
            </div>
            <div>
                <div style="color:var(--text-muted);">أدنى سعر 24h</div>
                <div class="stat-item-val" id="statLow24h">$0.00</div>
            </div>
        </div>

        <!-- حاوية الرسم البياني التفاعلي من DexScreener المباشر -->
        <div class="chart-container-box">
            <iframe 
                src="https://dexscreener.com/ton/EQCp7mlbe-eR-j6b7opnHBtCbl74gnyYAP2XZISphkERkwdJ?embed=1&theme=dark&trades=0&info=0" 
                title="ZNX Live DEX Chart" 
                loading="lazy"
                allow="clipboard-write"
                sandbox="allow-scripts allow-same-origin allow-popups">
            </iframe>
        </div>

        <button type="button" onclick="openStonLink()" class="ston-link-btn">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> عرض المجمّع الرسمي على STON.fi
        </button>
    </div>

    <!-- لوحة التحويل -->
    <div class="convert-card">
        <div class="section-title" style="margin-top:0;">
            <span><i class="fa-solid fa-right-left" style="color:#059669;"></i> تحويل العملة إلى ZNX</span>
        </div>
        
        <div class="quick-options">
            <button type="button" class="opt-btn-full" onclick="selectOption('max')">
                <i class="fa-solid fa-wallet"></i> استخدام كل الرصيد المتاح
            </button>
        </div>

        <div class="input-wrapper">
            <input type="number" id="convertInput" class="custom-input" placeholder="أدخل كمية نقاط ZN" min="0" step="any" autocomplete="off" oninput="onInputChange()">
        </div>

        <div class="preview-box">
            ستحصل على: <strong id="znxPreview" style="color:#0284c7;">0.0000 ZNX</strong>
        </div>

        <button type="button" class="btn-action" id="convertSubmitBtn" onclick="submitConvert()">تأكيد التحويل الآن</button>
    </div>

    <!-- تفاصيل الشرائح -->
    <div class="section-title">
        <span><i class="fa-solid fa-layer-group" style="color:#0284c7;"></i> شرائح التحويل الحالية</span>
    </div>
    <div class="tiers-list" id="tiersContainer"></div>

    <!-- عرش نخبة ZNX -->
    <div class="section-title">
        <span><i class="fa-solid fa-crown" style="color:#d97706;"></i> عرش نخبة ZNX</span>
        <span class="top10-badge"><i class="fa-solid fa-fire"></i> Top 10</span>
    </div>

    <div id="myRankCardContainer"></div>

    <div class="podium" id="podiumContainer"></div>
    
    <div id="rankingsContainer" style="margin-bottom: 20px;"></div>

    <script src="znx_wallet.js"></script>
</body>
</html>
