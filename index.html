<style>
    :root {
        --bg-color: #0b1120;
        --card-bg: #111827;
        --primary: #f59e0b;
        --telegram-blue: #0284c7;
        --ton-blue: #0098ea;
        --gold: #f59e0b;
        --accent-green: #10b981;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
    }

    .shop-container { 
        padding: 12px; 
        max-width: 500px; 
        margin: 0 auto; 
    }

    .shop-stats-bar {
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 6px;
        padding: 10px 6px; 
        background: #1e293b; 
        border-radius: 14px;
        margin-bottom: 15px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box {
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        background: rgba(15, 23, 42, 0.6); 
        padding: 8px 4px;
        border-radius: 10px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-weight: 800; font-size: 13px; }

    .ton-price-bar {
        background: rgba(0, 152, 234, 0.12); 
        border: 1px solid var(--ton-blue);
        border-radius: 12px; 
        padding: 12px 14px; 
        margin-bottom: 20px;
        display: flex; 
        justify-content: space-between; 
        align-items: center;
    }
</style>

<div class="shop-container">
    <!-- شريط الإحصائيات العلوي -->
    <div class="shop-stats-bar">
        <div class="stat-box">
            <span class="stat-label">🪙 ZN</span>
            <span data-bind="balance" id="shop-balance-text" class="stat-value" style="color: var(--primary);">0</span>
        </div>
        <div class="stat-box" style="border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05);">
            <span class="stat-label" style="color: var(--gold);">⚡ السرعة</span>
            <span data-bind="hourly_rate" id="shop-rate-text" class="stat-value" style="color: var(--gold);">+0/h</span>
        </div>
        <div class="stat-box">
            <span class="stat-label" style="color: var(--accent-green);">💵 USD</span>
            <span data-bind="usd_balance" id="shop-usd-text" class="stat-value" style="color: var(--accent-green);">$0.00</span>
        </div>
    </div>

    <!-- سعر TON المباشر -->
    <div class="ton-price-bar">
        <div style="font-size: 13px; font-weight: bold; color: var(--ton-blue);">
            💎 سعر TON المباشر:
        </div>
        <div id="ton-live-rate-text" data-bind="ton_price" style="font-weight: 800; color: #fff; font-size: 14px; direction: ltr;">
            $1.39
        </div>
    </div>

    <h3 style="color: #fff; margin-bottom: 12px; font-size: 16px; font-weight: bold;">💎 باقات العروض المميزة (الدفع التلقائي)</h3>
    
    <!-- حاوية الباقات الجاهزة للعرض المباشر -->
    <div class="usdt-container" id="usdt-packages-container">
        <!-- باقة البرونزية -->
        <div class="usdt-card bronze">
            <div class="usdt-icon">📦</div>
            <div class="usdt-title">البرونزية</div>
            <div class="usdt-price-usd">$1.00</div>
            <div class="usdt-price-ton">TON 0.72~</div>
            <div class="usdt-perks">
                ⚡ +150 ZN/h<br>
                📦 +2,000 مخزن<br>
                🪙 +30,000 ZN
            </div>
            <button class="btn-buy-package" onclick="buyPackage('bronze')">شراء تلقائي</button>
        </div>

        <!-- باقة الفضية -->
        <div class="usdt-card silver">
            <div class="usdt-icon">🚀</div>
            <div class="usdt-title">الفضية</div>
            <div class="usdt-price-usd">$3.00</div>
            <div class="usdt-price-ton">TON 2.16~</div>
            <div class="usdt-perks">
                ⚡ +540 ZN/h<br>
                📦 +7,200 مخزن<br>
                🪙 +108,000 ZN
            </div>
            <button class="btn-buy-package" onclick="buyPackage('silver')">شراء تلقائي</button>
        </div>
    </div>

    <!-- تبويبات الترقيات -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="tab-mining" onclick="switchShopTab('mining')" style="flex: 1; padding: 12px; background: var(--telegram-blue); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">⚡ ترقيات السرعة</button>
        <button id="tab-storage" onclick="switchShopTab('storage')" style="flex: 1; padding: 12px; background: #1e293b; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">📦 ترقيات المخزن</button>
    </div>

    <div id="shop-mining-section" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;"></div>
    <div id="shop-storage-section" style="display: none; grid-template-columns: repeat(2, 1fr); gap: 12px;"></div>
</div>
