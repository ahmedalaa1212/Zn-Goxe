<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zn Goxe - Crypto Mining</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loader-rocket">🚀</div>
        <h2>جاري تحميل اللعبة...</h2>
    </div>

    <div id="app" style="display: none;">
        <div id="view-friends" class="game-view"></div>
        <div id="view-wallet" class="game-view"></div>
        <div id="view-tasks" class="game-view"></div>
        <div id="view-farm" class="game-view active"></div>
        <div id="view-games" class="game-view"></div>
        <div id="view-shop" class="game-view"></div>
        <div id="view-settings" class="game-view"></div>
    </div>

    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item" onclick="switchView('friends')" id="nav-friends"><i class="fas fa-users"></i><span>الأصدقاء</span></button>
        <button class="nav-item" onclick="switchView('wallet')" id="nav-wallet"><i class="fas fa-wallet"></i><span>المحفظة</span></button>
        <button class="nav-item" onclick="switchView('tasks')" id="nav-tasks"><i class="fas fa-list-check"></i><span>المهام</span></button>
        
        <button class="nav-item nav-center-btn active" onclick="switchView('farm')" id="nav-farm">
            <div class="farm-btn-inner">
                <i class="fas fa-screwdriver-wrench"></i>
                <span>المزرعة</span>
            </div>
        </button>

        <button class="nav-item" onclick="switchView('games')" id="nav-games"><i class="fas fa-gamepad"></i><span>الألعاب</span></button>
        <button class="nav-item" onclick="switchView('shop')" id="nav-shop"><i class="fas fa-store"></i><span>المتجر</span></button>
        <button class="nav-item" onclick="switchView('settings')" id="nav-settings"><i class="fas fa-cog"></i><span>الإعدادات</span></button>
    </nav>

    <script src="game.js"></script>
</body>
</html>
