<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name='admaven-placement' content='BqTU9qjgH'>
<meta name="clckd" content="33fdc2db6d7c74829748874cd984ec1d" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zn Goxe - Crypto Mining</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://libtl.com/sdk.js" data-zone="11322720" data-sdk="show_11322720"></script>
    
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <link rel="stylesheet" href="farm/farm.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* إجبار إخفاء القوائم غير النشطة تماماً لمنع ظهور أي أزرار أو أشرطة متداخلة */
        .game-view {
            display: none !important;
            width: 100%;
            box-sizing: border-box;
        }
        .game-view.active {
            display: block !important;
        }

        /* تثبيت شريط التنقل السفلي ورصيف الأولوية لمنع تداخله */
        .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            z-index: 999999 !important;
        }

        /* ستايل الرسالة العائمة للمرتجعات */
        #global-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: 2px solid #ffcc00;
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 99999999;
            display: none;
            align-items: center;
            gap: 15px;
            font-family: Tahoma, sans-serif;
            width: 85%;
            max-width: 350px;
            animation: slideDown 0.5s ease-out;
        }
        @keyframes slideDown {
            0% { top: -50px; opacity: 0; }
            100% { top: 20px; opacity: 1; }
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="global-toast">
        <span style="font-size: 30px;">💰</span>
        <div style="display: flex; flex-direction: column; flex-grow: 1;">
            <span style="font-size: 15px; color: #ffcc00; font-weight: bold; margin-bottom: 3px;">تم استرجاع رصيدك!</span>
            <span id="toast-msg" style="font-size: 12px; color: #ddd;">تم رد الرصيد لعدم اكتمال الساحة.</span>
        </div>
        <button onclick="document.getElementById('global-toast').style.display='none'" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
    </div>

    <div id="loading-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:9999999; display:flex; justify-content:center; align-items:center; flex-direction:column; color:white;">
        <div style="font-size: 50px; margin-bottom: 20px; animation: pulse 1.5s infinite;">🚀</div>
        <h2 style="color:#f59e0b; margin:0; font-family: Tahoma, sans-serif; font-size: 18px;">جاري تحميل اللعبة...</h2>
    </div>

    <div id="app" style="display: none;">
        <div id="view-friends" class="game-view"></div>
        <div id="view-wallet" class="game-view"></div>
        <div id="view-tasks" class="game-view"></div>
        <div id="view-farm" class="game-view active"></div>
        <div id="view-games" class="game-view"></div>
        <div id="view-shop" class="game-view"></div>
        <div id="view-settings" class="game-view"></div>
    </div>

    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item" onclick="switchView('friends')" id="nav-friends">
            <i class="fas fa-users"></i><span>الأصدقاء</span>
        </button>
        <button class="nav-item" onclick="switchView('wallet')" id="nav-wallet">
            <i class="fas fa-wallet"></i><span>المحفظة</span>
        </button>
        <button class="nav-item" onclick="switchView('tasks')" id="nav-tasks">
            <i class="fas fa-list-check"></i><span>المهام</span>
        </button>
        <button class="nav-item nav-center-btn active" onclick="switchView('farm')" id="nav-farm">
            <i class="fas fa-screwdriver-wrench"></i>
            <span class="nav-center-text">المزرعة</span>
        </button>
        <button class="nav-item" onclick="switchView('games')" id="nav-games">
            <i class="fas fa-gamepad"></i><span>الألعاب</span>
        </button>
        <button class="nav-item" onclick="switchView('shop')" id="nav-shop">
            <i class="fas fa-store"></i><span>المتجر</span>
        </button>
        <button class="nav-item" onclick="switchView('settings')" id="nav-settings">
            <i class="fas fa-cog"></i><span>الإعدادات</span>
        </button>
    </nav>

    <script>
        async function verifyAndStartGame() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready(); 
                window.Telegram.WebApp.expand(); 
            }

            const initData = window.Telegram?.WebApp?.initData;
            if (!initData) {
                console.log("⚠️ وضع المتصفح: تم فتح اللعبة للمراجعة. لن يتم حفظ أي بيانات حقيقية.");
            }

            await loadAllViews();

            // حقن الإعلانات
            let onlickaScript = document.createElement('script');
            onlickaScript.src = "https://js.onclckmn.com/static/onclicka.js";
            onlickaScript.setAttribute('data-admpid', '449096');
            onlickaScript.async = true;
            document.body.appendChild(onlickaScript);

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('main-nav').style.display = 'flex';

            // 🔍 البحث عن أي مبالغ مستردة من الألعاب بمجرد فتح البوت
            checkGlobalNotifications();
        }

        async function checkGlobalNotifications() {
            const initData = window.Telegram?.WebApp?.initData;
            if (!initData) return;
            try {
                let response = await fetch('/api/games/check_notifications', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ initData: initData })
                });
                let resData = await response.json();
                if (resData.success && resData.refund > 0) {
                    let msgEl = document.getElementById('toast-msg');
                    if (msgEl) msgEl.innerText = `تم رد ${resData.refund.toLocaleString()} ZN لعدم اكتمال النصاب.`;
                    
                    let toast = document.getElementById('global-toast');
                    if (toast) {
                        toast.style.display = 'flex';
                        // إخفاء الرسالة تلقائياً بعد 7 ثواني
                        setTimeout(() => { toast.style.display = 'none'; }, 7000);
                    }
                    
                    // تحديث رصيد الواجهة ليعكس المبلغ المضاف
                    if (typeof window.fetchPlayerDataFromServer === 'function') {
                        window.fetchPlayerDataFromServer();
                    }
                }
            } catch(e) { console.error("Error checking notifications:", e); }
        }

        async function loadAllViews() {
            const cacheVersion = new Date().getTime(); 
            
            const views = [
                { id: 'view-friends', path: 'friends/friends.html' },
                { id: 'view-wallet', path: 'wallet/wallet.html' },
                { id: 'view-tasks', path: 'tasks/tasks.html' },
                { id: 'view-farm', path: 'farm/farm.html' },
                { id: 'view-games', path: 'games/games.html' },
                { id: 'view-shop', path: 'shop/shop.html' },
                { id: 'view-settings', path: 'settings/settings.html' }
            ];

            for (let view of views) {
                try {
                    let response = await fetch(`${view.path}?v=${cacheVersion}`);
                    if (response.ok) {
                        let html = await response.text();
                        document.getElementById(view.id).innerHTML = html;
                    } else {
                        console.error(`❌ خطأ في تحميل ${view.path}: كود ${response.status}`);
                    }
                } catch (error) {
                    console.error("❌ فشل الاتصال لتحميل العرض:", view.path, error);
                }
            }

            loadScript(`game.js?v=${cacheVersion}`, () => {
                const scripts = [
                    'friends/friends.js', 'wallet/wallet.js', 'tasks/tasks.js',
                    'farm/farm.js', 'games/games.js', 'shop/shop.js', 'settings/settings.js'
                ];
                scripts.forEach(jsPath => {
                    loadScript(`${jsPath}?v=${cacheVersion}`);
                });
            });
        }

        function loadScript(src, callback) {
            let script = document.createElement('script');
            script.src = src;
            script.async = false; 
            if (callback) script.onload = callback;
            document.body.appendChild(script);
        }

        function switchView(viewName) {
            // إخفاء جميع العروض بشكل صريح وصارم
            document.querySelectorAll('.game-view').forEach(v => {
                v.classList.remove('active');
                v.style.setProperty('display', 'none', 'important');
            });

            // إظهار الصفحة المستهدفة فقط
            let targetView = document.getElementById(`view-${viewName}`);
            if (targetView) {
                targetView.classList.add('active');
                targetView.style.setProperty('display', 'block', 'important');
            }
            
            // تحديث حالة الأزرار في القائمة السفلية
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            let targetNav = document.getElementById(`nav-${viewName}`);
            if (targetNav) targetNav.classList.add('active');

            // إرجاع التمرير لأعلى الصفحة عند التبديل
            window.scrollTo(0, 0);

            if (typeof window.triggerAllUIUpdates === 'function') {
                window.triggerAllUIUpdates();
            }
        }

        document.addEventListener('DOMContentLoaded', verifyAndStartGame);
    </script>
</body>
</html>
