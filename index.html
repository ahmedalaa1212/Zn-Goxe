<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Monetag Rewarded Interstitial SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11322720' data-sdk='show_11322720'></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zn Goxe - Crypto Mining</title>

    <!-- FontAwesome & Telegram & TON Connect SDKs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <!-- إضافة رقم إصدار لكسر كاش الملفات الصامت -->
    <link rel="stylesheet" href="style.css?v=2.7">

    <!-- تنسيقات الحاوية والعرض وضمان عدم حدوث الشاشة الزرقاء الفارغة -->
    <style>
        /* إجبار أبعاد الحاويات لمنع انهيار الارتفاع بالشاشة الزرقاء */
        #app {
            width: 100%;
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
        }

        .game-view {
            display: none;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-view.active {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        /* تنسيقات شاشة التحميل وضمان عدم حجبها للرؤية عند الإخفاء */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d131d;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #loading-screen.hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            display: none !important;
        }

        /* حاوية الإشعارات المباشرة فوق أي قائمة */
        #global-toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .global-toast {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #238636;
            border-right: 5px solid #2ea043;
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .global-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .global-toast .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .global-toast i {
            font-size: 20px;
            color: #3fb950;
        }
    </style>
</head>
<body>

    <!-- حاوية الإشعارات المنبثقة المباشرة -->
    <div id="global-toast-container"></div>

    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="loader-rocket">🚀</div>
        <h2>جاري تحميل اللعبة...</h2>
    </div>

    <!-- حاوية الواجهات الفرعية -->
    <div id="app" style="display: none;">
        <div id="view-friends" class="game-view" data-view="friends"></div>
        <div id="view-wallet" class="game-view" data-view="wallet">
            <!-- سيتم تحميل wallet/wallet.html هنا ديناميكياً -->
        </div>
        <div id="view-tasks" class="game-view" data-view="tasks"></div>
        <div id="view-farm" class="game-view active" data-view="farm"></div>
        <div id="view-games" class="game-view" data-view="games">
            <!-- سيتم تحميل games/games.html هنا ديناميكياً -->
        </div>
        <div id="view-shop" class="game-view" data-view="shop">
            <!-- سيتم تحميل shop/shop.html هنا ديناميكياً -->
        </div>
        <div id="view-settings" class="game-view" data-view="settings"></div>
    </div>

    <!-- شريط التنقل السفلي الاحترافي -->
    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item" data-view="friends" id="nav-friends">
            <i class="fas fa-users"></i>
            <span>الأصدقاء</span>
        </button>

        <button class="nav-item" data-view="wallet" id="nav-wallet">
            <i class="fas fa-wallet"></i>
            <span>المحفظة</span>
        </button>

        <button class="nav-item" data-view="tasks" id="nav-tasks">
            <i class="fas fa-list-check"></i>
            <span>المهام</span>
        </button>

        <button class="nav-item nav-center-btn active" data-view="farm" id="nav-farm">
            <div class="farm-btn-inner">
                <i class="fas fa-screwdriver-wrench"></i>
                <span>المزرعة</span>
            </div>
        </button>

        <button class="nav-item" data-view="games" id="nav-games">
            <i class="fas fa-gamepad"></i>
            <span>الألعاب</span>
        </button>

        <button class="nav-item" data-view="shop" id="nav-shop">
            <i class="fas fa-store"></i>
            <span>المتجر</span>
        </button>

        <button class="nav-item" data-view="settings" id="nav-settings">
            <i class="fas fa-cog"></i>
            <span>الإعدادات</span>
        </button>
    </nav>

    <!-- كود كشف الكيبورد الذكي بدون رعشة -->
    <script>
        (function initKeyboardDetection() {
            const viewport = window.visualViewport;
            let isKeyboardOpen = false;

            function handleViewportChange() {
                if (!viewport) return;

                const open = (window.innerHeight - viewport.height) > 150;

                if (open !== isKeyboardOpen) {
                    isKeyboardOpen = open;
                    if (isKeyboardOpen) {
                        document.body.classList.add('keyboard-open');
                    } else {
                        document.body.classList.remove('keyboard-open');
                    }
                }
            }

            if (viewport) {
                viewport.addEventListener('resize', handleViewportChange);
            }
        })();
    </script>

    <!-- محرك الإشعارات الفوري وتحديث الرصيد اللحظي -->
    <script>
        (function initRealtimeNotificationSystem() {
            window.showGlobalToast = function(msg, iconClass = 'fa-circle-check') {
                const container = document.getElementById('global-toast-container');
                if (!container || !msg) return;

                const toast = document.createElement('div');
                toast.className = 'global-toast';
                toast.innerHTML = `
                    <div class="toast-content">
                        <i class="fas ${iconClass}"></i>
                        <span>${msg}</span>
                    </div>
                `;
                container.appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 20);

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 4500);
            };

            function pollNotificationsAndBalance() {
                let uid = "";
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    uid = window.Telegram.WebApp.initDataUnsafe.user.id;
                }
                if (!uid) {
                    uid = localStorage.getItem('tg_id') || localStorage.getItem('uid') || localStorage.getItem('user_id') || "";
                }
                if (!uid) return;

                fetch(`/api/games/check_notifications?tg_id=${encodeURIComponent(uid)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.success) {
                            if (data.has_notification && data.message) {
                                showGlobalToast(data.message);
                            }

                            if (data.balance !== undefined) {
                                const balanceSelectors = document.querySelectorAll('.user-balance-val, #user-balance, #balance-display, .balance-amount');
                                balanceSelectors.forEach(el => {
                                    el.textContent = data.balance;
                                });
                            }
                        }
                    })
                    .catch(() => {});
            }

            document.addEventListener('DOMContentLoaded', () => {
                pollNotificationsAndBalance();
                setInterval(pollNotificationsAndBalance, 3500);
            });
        })();
    </script>

    <!-- استدعاء المحرك الأساسي بكسر الكاش الصارم -->
    <script src="game.js?v=2.7"></script>
</body>
</html>
