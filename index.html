<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Monetag Rewarded Interstitial SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11322720' data-sdk='show_11322720'></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zn Goxe - Crypto Mining</title>

    <!-- FontAwesome & Telegram & TON Connect SDKs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <!-- رفع إصدار CSS لكسر كاش المتصفح وتأكيد التعديلات -->
    <link rel="stylesheet" href="style.css?v=3.0">

    <style>
        #global-toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .global-toast {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #238636;
            border-right: 5px solid #2ea043;
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .global-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .global-toast .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .global-toast i {
            font-size: 20px;
            color: #3fb950;
        }
    </style>
</head>
<body>

    <!-- حاوية الإشعارات المنبثقة المباشرة -->
    <div id="global-toast-container"></div>

    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="loader-rocket">🚀</div>
        <h2>جاري تحميل اللعبة...</h2>
    </div>

    <!-- حاوية الواجهات الفرعية -->
    <div id="app" style="display: none;">
        <div id="view-friends" class="game-view"></div>
        
        <!-- واجهة المحفظة المباشرة المدمجة -->
        <div id="view-wallet" class="game-view">
            <div class="wallet-container">
                <div class="card-glass wallet-main-card">
                    <div class="wallet-header-title">
                        <i class="fas fa-wallet"></i>
                        <span>رصيد المحفظة</span>
                    </div>
                    <div class="wallet-balance-amount" id="wallet-balance-display">
                        <span class="user-balance-val">1,530.69</span> <span class="currency-tag">ZN</span>
                    </div>
                    <div class="wallet-usd-value" id="wallet-usd-display">$888,886.75 USD</div>
                    
                    <div class="ton-connect-wrapper">
                        <div id="ton-connect-btn"></div>
                        <div class="wallet-status" id="wallet-status-text">
                            <i class="fas fa-link-slash"></i> المحفظة غير متصلة
                        </div>
                    </div>
                </div>

                <div class="wallet-tabs">
                    <button class="w-tab active" onclick="switchWalletTab('deposit')">
                        <i class="fas fa-arrow-down-left"></i> إيداع
                    </button>
                    <button class="w-tab" onclick="switchWalletTab('withdraw')">
                        <i class="fas fa-arrow-up-right"></i> سحب
                    </button>
                    <button class="w-tab" onclick="switchWalletTab('history')">
                        <i class="fas fa-clock-rotate-left"></i> السجل
                    </button>
                </div>

                <div id="w-pane-deposit" class="w-pane active">
                    <div class="card-glass">
                        <div class="pane-title"><i class="fas fa-qrcode"></i> عنوان إيداع TON</div>
                        <p class="pane-desc">انسخ العنوان أدناه لإيداع عملات TON في حسابك مباشرة:</p>
                        <div class="copy-box">
                            <input type="text" id="deposit-address" value="EQD_YOUR_TON_DEPOSIT_ADDRESS_HERE" readonly>
                            <button onclick="copyDepositAddress()"><i class="fas fa-copy"></i> نسخ</button>
                        </div>
                    </div>
                </div>

                <div id="w-pane-withdraw" class="w-pane" style="display: none;">
                    <div class="card-glass">
                        <div class="pane-title"><i class="fas fa-paper-plane"></i> سحب الأرباح</div>
                        <div class="form-group">
                            <label>مبلغ السحب (ZN):</label>
                            <input type="number" id="withdraw-amount" placeholder="أدخل المبلغ...">
                        </div>
                        <div class="form-group">
                            <label>عنوان محفظة TON المستلمة:</label>
                            <input type="text" id="withdraw-address" placeholder="EQ...">
                        </div>
                        <button class="btn-primary-action" onclick="submitWithdrawal()"><i class="fas fa-check-circle"></i> تأكيد السحب</button>
                    </div>
                </div>

                <div id="w-pane-history" class="w-pane" style="display: none;">
                    <div class="card-glass">
                        <div class="pane-title"><i class="fas fa-list"></i> سجل المعاملات</div>
                        <div id="wallet-history-list" class="history-empty">
                            <i class="fas fa-receipt"></i>
                            <p>لا توجد معاملات عملية حتى الآن</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-tasks" class="game-view"></div>
        <div id="view-farm" class="game-view active"></div>
        <div id="view-games" class="game-view">
            <!-- سيتم تحميل games/games.html هنا ديناميكياً -->
        </div>
        <div id="view-shop" class="game-view">
            <!-- سيتم تحميل shop/shop.html هنا ديناميكياً -->
        </div>
        <div id="view-settings" class="game-view"></div>
    </div>

    <!-- شريط التنقل السفلي الاحترافي -->
    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item" onclick="switchView('friends')" id="nav-friends">
            <i class="fas fa-users"></i>
            <span>الأصدقاء</span>
        </button>

        <button class="nav-item" onclick="switchView('wallet')" id="nav-wallet">
            <i class="fas fa-wallet"></i>
            <span>المحفظة</span>
        </button>

        <button class="nav-item" onclick="switchView('tasks')" id="nav-tasks">
            <i class="fas fa-list-check"></i>
            <span>المهام</span>
        </button>

        <button class="nav-item nav-center-btn active" onclick="switchView('farm')" id="nav-farm">
            <div class="farm-btn-inner">
                <i class="fas fa-screwdriver-wrench"></i>
                <span>المزرعة</span>
            </div>
        </button>

        <button class="nav-item" onclick="switchView('games')" id="nav-games">
            <i class="fas fa-gamepad"></i>
            <span>الألعاب</span>
        </button>

        <button class="nav-item" onclick="switchView('shop')" id="nav-shop">
            <i class="fas fa-store"></i>
            <span>المتجر</span>
        </button>

        <button class="nav-item" onclick="switchView('settings')" id="nav-settings">
            <i class="fas fa-cog"></i>
            <span>الإعدادات</span>
        </button>
    </nav>

    <!-- كود كشف الكيبورد الذكي بدون رعشة -->
    <script>
        (function initKeyboardDetection() {
            const viewport = window.visualViewport;
            let isKeyboardOpen = false;

            function handleViewportChange() {
                if (!viewport) return;

                const open = (window.innerHeight - viewport.height) > 150;

                if (open !== isKeyboardOpen) {
                    isKeyboardOpen = open;
                    if (isKeyboardOpen) {
                        document.body.classList.add('keyboard-open');
                    } else {
                        document.body.classList.remove('keyboard-open');
                    }
                }
            }

            if (viewport) {
                viewport.addEventListener('resize', handleViewportChange);
            }
        })();
    </script>

    <!-- وظائف تفاعلية للتحكم بتبويبات المحفظة -->
    <script>
        window.switchWalletTab = function(tabName) {
            document.querySelectorAll('.w-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.w-pane').forEach(p => {
                p.style.display = 'none';
                p.classList.remove('active');
            });
            
            const activeBtn = document.querySelector(`.w-tab[onclick*="${tabName}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            
            const targetPane = document.getElementById(`w-pane-${tabName}`);
            if (targetPane) {
                targetPane.style.display = 'block';
                targetPane.classList.add('active');
            }
        };

        window.copyDepositAddress = function() {
            const input = document.getElementById('deposit-address');
            if (input) {
                input.select();
                navigator.clipboard.writeText(input.value);
                if (typeof window.showGlobalToast === 'function') {
                    window.showGlobalToast('تم نسخ عنوان الإيداع بنجاح!');
                } else {
                    alert('تم نسخ عنوان الإيداع!');
                }
            }
        };
    </script>

    <!-- محرك الإشعارات الفوري وتحديث الرصيد اللحظي -->
    <script>
        (function initRealtimeNotificationSystem() {
            window.showGlobalToast = function(msg, iconClass = 'fa-circle-check') {
                const container = document.getElementById('global-toast-container');
                if (!container || !msg) return;

                const toast = document.createElement('div');
                toast.className = 'global-toast';
                toast.innerHTML = `
                    <div class="toast-content">
                        <i class="fas ${iconClass}"></i>
                        <span>${msg}</span>
                    </div>
                `;
                container.appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 20);

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 4500);
            };

            function pollNotificationsAndBalance() {
                let uid = "";
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    uid = window.Telegram.WebApp.initDataUnsafe.user.id;
                }
                if (!uid) {
                    uid = localStorage.getItem('tg_id') || localStorage.getItem('uid') || localStorage.getItem('user_id') || "";
                }
                if (!uid) return;

                fetch(`/api/games/check_notifications?tg_id=${encodeURIComponent(uid)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.success) {
                            if (data.has_notification && data.message) {
                                showGlobalToast(data.message);
                            }

                            if (data.balance !== undefined) {
                                const balanceSelectors = document.querySelectorAll('.user-balance-val, #user-balance, #balance-display, .balance-amount');
                                balanceSelectors.forEach(el => {
                                    el.textContent = data.balance;
                                });
                            }
                        }
                    })
                    .catch(() => {});
            }

            document.addEventListener('DOMContentLoaded', () => {
                pollNotificationsAndBalance();
                setInterval(pollNotificationsAndBalance, 3500);
            });
        })();
    </script>

    <!-- استدعاء المحرك الأساسي بكسر الكاش الصارم -->
    <script src="game.js?v=3.0"></script>
</body>
</html>
