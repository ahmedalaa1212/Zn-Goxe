    <!-- OnClickA Script -->

    <!-- Monetag / Direct Script -->

    <style>
        /* تنسيق شاشة التنبيه للعمل فقط داخل التليجرام */
        #telegram-only-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 999999;
            padding: 20px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .tg-only-card {
            max-width: 360px;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .tg-only-card i.fa-telegram-plane {
            font-size: 60px;
            color: #0088cc;
            margin-bottom: 15px;
        }
        .tg-only-card h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #f8fafc;
        }
        .tg-only-card p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 22px;
        }
        .tg-open-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #0088cc;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .tg-open-btn:hover {
            background: #0077b5;
        }
    </style>
</head>
<body>

    <!-- شاشة التنبيه للمتصفح الخارجي -->
    <div id="telegram-only-screen" style="display: none;">
        <div class="tg-only-card">
            <i class="fab fa-telegram-plane"></i>
            <h2>التطبيق يعمل داخل Telegram فقط</h2>
            <p>للاستمتاع بالتطبيق وجمع العملات والتعدين المباشر، يرجى فتح اللعبة من خلال البوت الرسمي داخل تطبيق تليجرام.</p>
            <a href="https://t.me/" id="tg-bot-link" target="_blank" class="tg-open-btn">
                <i class="fab fa-telegram"></i> فتح في تليجرام
            </a>
        </div>
    </div>

    <div id="global-toast-container"></div>

    <div id="loading-screen">
        <div class="loader-rocket">🚀</div>
        <h2>جاري تحميل اللعبة...</h2>
    </div>

    <div id="app" style="display: none;">
        <div id="view-settings" class="game-view"></div>
        <div id="view-games" class="game-view"></div>
        <div id="view-offers" class="game-view"></div>
        <div id="view-shop" class="game-view"></div>
        <div id="view-farm" class="game-view active"></div>
        <div id="view-tasks" class="game-view"></div>
        <div id="view-wallet" class="game-view"></div>
        <div id="view-leaderboard" class="game-view"></div>
        <div id="view-friends" class="game-view"></div>
    </div>

    <!-- شريط التنقل السفلي المكون من 9 قوائم مرتبة من اليسار إلى اليمين -->
    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item" id="nav-settings" data-view="settings">
            <i class="fas fa-cog"></i>
            <span>الإعدادات</span>
        </button>

        <button class="nav-item" id="nav-games" data-view="games">
            <i class="fas fa-gamepad"></i>
            <span>الألعاب</span>
        </button>

        <button class="nav-item" id="nav-offers" data-view="offers">
            <i class="fas fa-gift"></i>
            <span>أرباح العروض</span>
        </button>

        <button class="nav-item" id="nav-shop" data-view="shop">
            <i class="fas fa-store"></i>
            <span>المتجر</span>
        </button>

        <!-- زر المزرعة المركزي -->
        <button class="nav-item nav-center-btn active" id="nav-farm" data-view="farm">
            <div class="farm-btn-inner">
                <i class="fas fa-screwdriver-wrench"></i>
                <span>المزرعة</span>
            </div>
        </button>

        <button class="nav-item" id="nav-tasks" data-view="tasks">
            <i class="fas fa-list-check"></i>
            <span>المهام</span>
        </button>

        <button class="nav-item" id="nav-wallet" data-view="wallet">
            <i class="fas fa-wallet"></i>
            <span>المحفظة</span>
        </button>

        <button class="nav-item" id="nav-leaderboard" data-view="leaderboard">
            <i class="fas fa-trophy"></i>
            <span>المتصدرين</span>
        </button>

        <button class="nav-item" id="nav-friends" data-view="friends">
            <i class="fas fa-users"></i>
            <span>الأصدقاء</span>
        </button>
    </nav>

    <!-- سكريبت التحقق من بيئة التليجرام -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const tg = window.Telegram?.WebApp;

            // التحقق من وجود بيانات التليجرام أو فتح المنصة داخل TMA
            const isTelegram = tg && (
                (tg.initData && tg.initData.length > 0) || 
                (tg.platform && tg.platform !== "unknown")
            );

            if (!isTelegram) {
                // إخفاء التحميل واللعبة وشريط التنقل
                const loadingScreen = document.getElementById('loading-screen');
                const app = document.getElementById('app');
                const mainNav = document.getElementById('main-nav');

                if (loadingScreen) loadingScreen.style.display = 'none';
                if (app) app.style.display = 'none';
                if (mainNav) mainNav.style.display = 'none';

                // إظهار واجهة التنبيه فقط
                const tgOnlyScreen = document.getElementById('telegram-only-screen');
                if (tgOnlyScreen) tgOnlyScreen.style.display = 'flex';
            }
        });

        (function initKeyboardDetection() {
            const viewport = window.visualViewport;
            let isKeyboardOpen = false;

            function handleViewportChange() {
                if (!viewport) return;
                const open = (window.innerHeight - viewport.height) > 150;
                if (open !== isKeyboardOpen) {
                    isKeyboardOpen = open;
                    if (isKeyboardOpen) {
                        document.body.classList.add('keyboard-open');
                    } else {
                        document.body.classList.remove('keyboard-open');
                    }
                }
            }

            if (viewport) {
                viewport.addEventListener('resize', handleViewportChange);
            }
        })();
    </script>

    <!-- استدعاء سكريبت المحفظة وسكريبت اللعبة الرئيسي -->
    <script src="wallet/wallet.js"></script>
    <script src="game.js?v=3.5"></script>
</body>
</html>
