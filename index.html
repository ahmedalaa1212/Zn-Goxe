    <style>
        /* تنسيق شاشة التنبيه للمتصفح الخارجي */
        #telegram-only-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .tg-card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }

        .tg-icon {
            font-size: 60px;
            color: #0088cc;
            margin-bottom: 20px;
        }

        .tg-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        .tg-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .tg-btn {
            display: inline-block;
            background-color: #0088cc;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.3s ease;
        }

        .tg-btn:hover {

        }

    <!-- شاشة التنبيه (تظهر فقط عند الفتح خارج التليجرام) -->

            <div class="tg-title">التطبيق يعمل داخل التليجرام فقط</div>
            <div class="tg-desc">عذراً، لا يمكن تشغيل لعبة ZN Goxe عبر المتصفحات العادية. يرجى فتح اللعبة عبر البوت الرسمي في تطبيق Telegram.</div>
            <a href="https://t.me/YourBotUsername" id="tg-bot-link" class="tg-btn">الذهاب للبوت في التليجرام</a>
        </div>
    </div>

        <div id="view-tasks" class="game-view"></div>
        <div id="view-wallet" class="game-view"></div>
        <div id="view-leaderboard" class="game-view"></div>
        <div id="view-friends" class="game-view"></div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item" id="nav-settings" data-view="settings">
            <i class="fas fa-cog"></i>

        <button class="nav-item" id="nav-games" data-view="games">

        </button>

        <button class="nav-item" id="nav-offers" data-view="offers">

        </button>
    </nav>

    <script>
        // التحقق من فتح التطبيق داخل التليجرام
        (function checkTelegramEnvironment() {
            const tg = window.Telegram?.WebApp;
            // يكون initData محتملاً فقط إذا فتح التطبيق من داخل التليجرام فعلياً
            const isInsideTelegram = Boolean(tg && tg.initData && tg.initData.trim() !== "");

            if (!isInsideTelegram) {
                // إخفاء الواجهات الرئيسية وإظهار شاشة التنبيه
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('app').style.display = 'none';
                document.getElementById('main-nav').style.display = 'none';
                document.getElementById('telegram-only-screen').style.display = 'flex';
                
                // إيقاف تحميل باقي السكريبتات الخاصة باللعبة
                window.stop();
            } else {
                tg.ready();
                tg.expand();
            }
        })();

        (function initKeyboardDetection() {
            const viewport = window.visualViewport;
            let isKeyboardOpen = false;

            function handleViewportChange() {
                if (!viewport) return;
                const open = (window.innerHeight - viewport.height) > 150;
                if (open !== isKeyboardOpen) {
                    isKeyboardOpen = open;
                    if (isKeyboardOpen) {
                        document.body.classList.add('keyboard-open');
                    } else {
                        document.body.classList.remove('keyboard-open');
                    }
                }
            }

            if (viewport) {
                viewport.addEventListener('resize', handleViewportChange);
            }
        })();
    </script>

    <!-- استدعاء سكريبت المحفظة وسكريبت اللعبة الرئيسي -->
